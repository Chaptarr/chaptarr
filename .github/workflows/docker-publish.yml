name: Docker Build and Publish

# Never fires on its own. Only release.yml can call it after manual CI succeeds.
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      branch:
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

    - name: Validate release inputs
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.branch }}" != "main" ]]; then
          echo "Docker publication requires branch=main."
          exit 1
        fi

        if [[ "$(git rev-parse HEAD)" != "${{ inputs.sha }}" ]]; then
          echo "Checked-out commit does not match the release commit."
          exit 1
        fi

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Generate Docker tags
      id: docker-tags
      shell: bash
      run: |
        set -euo pipefail

        sha="$(git rev-parse HEAD)"
        branch="${{ inputs.branch }}"
        version="$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
        release_tag="v${version}"

        if [[ "$(git tag --points-at "$sha" --list "$release_tag")" != "$release_tag" ]]; then
          echo "Release tag $release_tag does not point to $sha; refusing to publish Docker images."
          exit 1
        fi

        tags=()

        image="${REGISTRY}/${GITHUB_REPOSITORY,,}"

        if [[ "$branch" == "main" ]]; then
          tags+=("$image:$branch")
          tags+=("$image:latest")
        fi

        # Exact version tags keep stable releases immutable and distinct from latest.
        while IFS= read -r tag; do
          tags+=("$image:${tag#v}")
        done < <(git tag --points-at "$sha" 'v*' | sort -V)

        if [[ "${#tags[@]}" -eq 0 ]]; then
          echo "No Docker tags generated for $sha; skipping publish."
          echo "has_tags=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "has_tags=true" >> "$GITHUB_OUTPUT"
        {
          echo 'tags<<EOF'
          printf '%s\n' "${tags[@]}" | sort -u
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      if: steps.docker-tags.outputs.has_tags == 'true'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
      with:
        context: .
        file: ./Dockerfile.cross
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: true
        tags: ${{ steps.docker-tags.outputs.tags }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
