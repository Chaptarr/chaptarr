# ng-runner-policy: trusted-hosted-or-private-jit-v1
name: Validate standalone release assets
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Admit this workflow to the private JIT broker
        required: true
        type: choice
        options:
          - ci
      runner_pool:
        description: Select compatible GitHub-hosted or private JIT runners
        required: true
        type: choice
        default: public
        options:
          - public
          - private
      runtime_packs_run_id:
        description: Optional trusted archive run with matching successful runtime-pack producer
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: ng-standalone-asset-validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: false

jobs:
  verify-runtime-pack-install:
    name: Preserve existing .NET directory permissions
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'ci' &&
          (inputs.runner_pool == 'private' || inputs.runner_pool == 'public')
        )
      ) &&
      (
        true
      )
    runs-on: ${{ inputs.runner_pool == 'public' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-verify-runtime-pack-install"]}}', github.run_id)) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Test Linux x86 and FreeBSD runtime pack installation
      run: bash packaging/scripts/test-install-extra-platform-runtime-packs.sh
    - name: Test extra-platform NuGet source mapping
      run: bash packaging/scripts/test-create-standalone-nuget-config.sh
    - name: Test writable .NET SDK root preparation
      run: bash packaging/scripts/test-prepare-writable-dotnet-root.sh
    - name: Test SDK reference-pack collection across servicing versions
      run: bash packaging/scripts/test-copy-dotnet-sdk-reference-packs.sh
    - name: Test trusted runtime-pack reuse guards
      run: python3 -m unittest discover -s packaging/scripts -p test_runtime_pack_reuse.py

  frontend:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'ci' &&
          (inputs.runner_pool == 'private' || inputs.runner_pool == 'public')
        )
      ) &&
      (
        github.event_name != 'pull_request'
      )
    name: Build frontend once
    runs-on: ${{ inputs.runner_pool == 'public' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-frontend"]}}', github.run_id)) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Verify archive runtime ID matrices
      run: python3 packaging/scripts/check-standalone-rids.py

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Build frontend
      run: |
        npm install --global yarn@1.22.22
        yarn install --frozen-lockfile
        yarn build

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: standalone-validation-ui
        path: _output/UI/**
        retention-days: 7
        if-no-files-found: error

  extra-platform-runtimes:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'ci' &&
          (inputs.runner_pool == 'private' || inputs.runner_pool == 'public')
        )
      ) &&
      (
        github.event_name != 'pull_request'
      )
    name: Build Linux x86 and FreeBSD runtime packs
    runs-on: ${{ inputs.runner_pool == 'public' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-jit-linux-22-04","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-extra-platform-runtimes"]}}', github.run_id)) }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      if: inputs.runtime_packs_run_id == ''
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: |
          10.0.110
          10.0.111
          10.0.403

    - name: Build pinned extra-platform runtime packs
      if: inputs.runtime_packs_run_id == ''
      env:
        DOTNETVERSION: 10.0.403
        DOTNET_ROOT: ${{ runner.temp }}/dotnet
        PLATFORM_RUNTIME_WORK_DIR: ${{ runner.temp }}/chaptarrng-platform-runtime-work
        PLATFORM_RUNTIME_PACKS_OUTPUT: ${{ runner.temp }}/chaptarrng-platform-runtime-packs
      run: bash packaging/scripts/build-extra-platform-runtime-packs.sh

    - name: Verify reused runtime pack provenance
      if: inputs.runtime_packs_run_id != ''
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.runtime_packs_run_id }}
      run: |
        python3 packaging/scripts/verify-runtime-pack-reuse.py "$SOURCE_RUN_ID" \
          "$RUNNER_TEMP/runtime-pack-provenance.json"

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.runtime_packs_run_id != ''
      with:
        name: chaptarrng-platform-runtime-packs
        run-id: ${{ inputs.runtime_packs_run_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/chaptarrng-platform-runtime-packs

    - name: Retain original producer identity
      if: inputs.runtime_packs_run_id != ''
      run: cp "$RUNNER_TEMP/runtime-pack-provenance.json" "$RUNNER_TEMP/chaptarrng-platform-runtime-packs/reuse-provenance.json"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chaptarrng-platform-runtime-packs
        path: ${{ runner.temp }}/chaptarrng-platform-runtime-packs/**
        retention-days: 7
        if-no-files-found: error

  extra-standalone:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'ci' &&
          (inputs.runner_pool == 'private' || inputs.runner_pool == 'public')
        )
      ) &&
      (
        github.event_name != 'pull_request'
      )
    name: Build and verify ${{ matrix.rid }} archive
    needs: [frontend, extra-platform-runtimes]
    runs-on: ${{ inputs.runner_pool == 'public' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-{1}-extra-standalone"]}}', github.run_id, strategy.job-index)) }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x86, freebsd-x64]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: standalone-validation-ui
        path: _output/UI

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: chaptarrng-platform-runtime-packs
        path: ${{ runner.temp }}/platform-runtime-packs

    - name: Configure user-writable .NET install directory
      shell: bash
      run: |
        set -euo pipefail
        dotnet_dir="$RUNNER_TEMP/dotnet"
        mkdir -p -- "$dotnet_dir"
        printf 'DOTNET_INSTALL_DIR=%s\n' "$dotnet_dir" >> "$GITHUB_ENV"

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.403

    # Extra runtime packs must go into an owned copy of the runner-managed SDK.
    - name: Prepare writable .NET SDK root for extra platform packs
      env:
        DOTNET_ROOT: ${{ runner.temp }}/chaptarrng-dotnet
      shell: bash
      run: |
        set -euo pipefail
        source_dotnet_root="$(dirname -- "$(readlink -f -- "$(command -v dotnet)")")"
        bash packaging/scripts/prepare-writable-dotnet-root.sh "$source_dotnet_root" "$DOTNET_ROOT"

    - name: Build standalone application archive
      env:
        CUSTOM_RUNTIME_PACKS_DIR: ${{ runner.temp }}/platform-runtime-packs/packages
        DOTNET_ROOT: ${{ runner.temp }}/chaptarrng-dotnet
        DOTNETVERSION: 10.0.403
      run: bash packaging/scripts/build-standalone.sh 0.0.0 "${{ matrix.rid }}" "$RUNNER_TEMP/release-assets"

    - name: Verify archive and checksum sidecar
      env:
        RID: ${{ matrix.rid }}
      run: |
        set -euo pipefail
        asset="ChaptarrNG-0.0.0-${RID}.tar.gz"
        tar -tzf "$RUNNER_TEMP/release-assets/$asset" >/dev/null
        (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$asset.sha256")


  standalone:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'ci' &&
          (inputs.runner_pool == 'private' || inputs.runner_pool == 'public')
        )
      ) &&
      (
        github.event_name != 'pull_request'
      )
    name: Build and verify ${{ matrix.rid }} archive
    needs: frontend
    runs-on: ${{ inputs.runner_pool == 'public' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-{1}-standalone"]}}', github.run_id, strategy.job-index)) }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64, win-x64, win-x86]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: standalone-validation-ui
        path: _output/UI

    - name: Configure user-writable .NET install directory
      shell: bash
      run: |
        set -euo pipefail
        dotnet_dir="$RUNNER_TEMP/dotnet"
        mkdir -p -- "$dotnet_dir"
        printf 'DOTNET_INSTALL_DIR=%s\n' "$dotnet_dir" >> "$GITHUB_ENV"

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.403

    - name: Build standalone application archive
      run: bash packaging/scripts/build-standalone.sh 0.0.0 "${{ matrix.rid }}" "$RUNNER_TEMP/release-assets"

    - name: Verify archive and checksum sidecar
      env:
        RID: ${{ matrix.rid }}
      run: |
        set -euo pipefail
        if [[ "$RID" == win-* ]]; then
          asset="ChaptarrNG-0.0.0-${RID}.zip"
          unzip -t "$RUNNER_TEMP/release-assets/$asset" >/dev/null
        else
          asset="ChaptarrNG-0.0.0-${RID}.tar.gz"
          tar -tzf "$RUNNER_TEMP/release-assets/$asset" >/dev/null
          if [[ "$RID" == linux-* || "$RID" == osx-* ]]; then
            tar -tzf "$RUNNER_TEMP/release-assets/$asset" \
              | grep -Fx 'ChaptarrNG/scripts/bookshelfng-to-chaptarrng.sh' >/dev/null
            tar -tzf "$RUNNER_TEMP/release-assets/$asset" \
              | grep -Fx 'ChaptarrNG/scripts/capture-bookshelf-metadata-env.py' >/dev/null
          fi
        fi
        (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$asset.sha256")

    - name: Exercise migrated SeerrNG acquisition with real qBittorrent
      if: matrix.rid == 'linux-musl-x64'
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/acquisition-candidate"
        tar -xzf "$RUNNER_TEMP/release-assets/ChaptarrNG-0.0.0-linux-musl-x64.tar.gz" \
          -C "$RUNNER_TEMP/acquisition-candidate"
        docker build -t chaptarrng-acquisition-qbittorrent:20261105 \
          -f integration/acquisition/Dockerfile.qbittorrent integration/acquisition
        python3 integration/run-acquisition-smoke.py \
          --candidate "$RUNNER_TEMP/acquisition-candidate/ChaptarrNG" \
          --output "$RUNNER_TEMP/acquisition-evidence"
        if ! command -v ffmpeg >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        fi
        python3 integration/run-acquisition-smoke.py --media-type audiobook \
          --candidate "$RUNNER_TEMP/acquisition-candidate/ChaptarrNG" \
          --output "$RUNNER_TEMP/acquisition-audio-evidence"
        python3 integration/run-cover-proxy-smoke.py \
          --candidate "$RUNNER_TEMP/acquisition-candidate/ChaptarrNG" \
          --output "$RUNNER_TEMP/cover-proxy-evidence" \
          --source-commit "$GITHUB_SHA"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && matrix.rid == 'linux-musl-x64'
      with:
        name: migrated-acquisition-evidence
        path: |
          ${{ runner.temp }}/acquisition-evidence/*.json
          ${{ runner.temp }}/acquisition-evidence/*.log
          ${{ runner.temp }}/acquisition-audio-evidence/*.json
          ${{ runner.temp }}/acquisition-audio-evidence/*.log
          ${{ runner.temp }}/cover-proxy-evidence/*.json
          ${{ runner.temp }}/cover-proxy-evidence/*.log
          ${{ runner.temp }}/release-assets/ChaptarrNG-0.0.0-linux-musl-x64.tar.gz.sha256
        retention-days: 7
        if-no-files-found: error

