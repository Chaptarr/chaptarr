name: Announce to Discord
run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options:
          - announce
          - inspect
        required: true
      runner_pool:
        description: Runner pool
        type: choice
        options:
          - private
          - public
        required: true
      title:
        description: Discord embed title
        required: false
        type: string
      url:
        description: HTTPS link opened by the embed
        required: false
        type: string
      body:
        description: Announcement text
        required: false
        type: string

permissions:
  contents: read

jobs:
  announce:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          (inputs.action == 'announce' || inputs.action == 'inspect') &&
          (inputs.runner_pool == 'private' || inputs.runner_pool == 'public')
        )
      ) &&
      (
        github.ref == 'refs/heads/main'
      )
    runs-on: ${{ inputs.runner_pool == 'public' && 'ubuntu-24.04' || fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-announce"]}}', github.run_id)) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Inspect Discord destination
      if: inputs.action == 'inspect'
      env:
        DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      run: node scripts/inspect-discord-destination.mjs

    - name: Post announcement
      if: inputs.action == 'announce'
      env:
        DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        ANNOUNCEMENT_TITLE: ${{ inputs.title }}
        ANNOUNCEMENT_URL: ${{ inputs.url }}
        ANNOUNCEMENT_BODY: ${{ inputs.body }}
        ANNOUNCEMENT_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [[ -z "$DISCORD_RELEASE_WEBHOOK" ]]; then
          echo "::error::Add the DISCORD_RELEASE_WEBHOOK repository secret using the same webhook configured for SeerrNG."
          exit 1
        fi
        node scripts/post-discord-announcement.mjs
