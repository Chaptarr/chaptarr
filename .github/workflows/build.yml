name: Build Chaptarr

on:
  pull_request:
    branches: [ main, develop ]
  workflow_call:
  workflow_dispatch:

# Tests only, never publishes. Runs on PRs, not again after merge.
# Release-called runs are never cancelled.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Validate the UI before release.yml creates a tag or release, not just during
  # the later Docker build. The same frontend is used on every runtime platform.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: package.json

    - name: Setup Yarn
      run: npm install -g "yarn@$(node -p 'require("./package.json").volta.yarn')" --force

    - name: Install frontend dependencies
      run: yarn install --frozen-lockfile

    - name: Typecheck
      run: yarn typecheck

    - name: Check translation keys
      run: yarn check-translations

    - name: Check user-facing JSX text
      run: yarn check-jsx-literals

    - name: Build frontend
      run: yarn build

  build:
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: osx

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Guard (repo) - no merge-conflict markers
      shell: bash
      run: |
        if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
          echo "Merge-conflict markers found in tracked files."
          exit 1
        fi
        python -c "import json; json.load(open('package.json', encoding='utf-8'))"

    - name: Guard (version) - package.json and Directory.Build.props in sync
      shell: bash
      run: python3 build-tools/version_guard.py sync

    - name: Guard (version) - no decreases on develop
      if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/develop:refs/remotes/origin/develop"
          COMPARE_REF="origin/develop"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            echo "No reachable version tag is available for monotonic version comparison."
            exit 1
          fi
        fi

        python3 build-tools/version_guard.py monotonic \
          --compare-ref "$COMPARE_REF" \
          --event-path "$GITHUB_EVENT_PATH"

    - name: Guard (version) - version-only commits stay pure
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          COMPARE_REF="origin/${{ github.base_ref }}"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            echo "No reachable version tag is available for version-only commit hygiene."
            exit 1
          fi
        fi

        python3 build-tools/version_guard.py commit-hygiene --compare-ref "$COMPARE_REF"
    
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      if: runner.os == 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('src/NuGet.config', 'src/Directory.Packages.props', 'src/Directory.Build.props', 'src/Directory.Build.targets', 'src/Targets/**/*.targets', 'src/Chaptarr.NoTests.sln', 'src/**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-nuget-
    
    # FFmpeg is intentionally not downloaded in this compile/test workflow.
    # Source builds resolve bundled tools first and then the system PATH; explicit
    # native packaging owns bundled-tool acquisition and validation.

    - name: Restore dependencies
      run: |
        dotnet restore src/Chaptarr.NoTests.sln
        dotnet restore src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj
    
    - name: Build
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore
    
    - name: Build Windows tray host
      if: runner.os == 'Windows'
      run: dotnet build src/NzbDrone/Chaptarr.csproj --configuration Release

    - name: Check Core test runner
      run: python3 -m unittest discover -s build-tools -p test_run_core_tests.py

    - name: Build Core tests
      run: dotnet build src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release --no-restore

    - name: Test
      timeout-minutes: 60
      env:
        CHAPTARR_PHOTO_RESPONSE: ${{ runner.temp }}/author-photo-response.json
      run: python3 build-tools/run-core-tests.py --results TestResults/core --workers 6

    - name: Upload Core test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: core-tests-${{ matrix.os }}
        path: TestResults/core

    # Reuse the response emitted by the Core suite above. A correct API response
    # alone cannot catch a carousel selecting the wrong photo after a reorder.
    - name: Setup Node for browser check
      if: runner.os == 'Linux'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: package.json

    - name: Install browser check dependencies
      id: browser_deps
      timeout-minutes: 10
      if: runner.os == 'Linux'
      run: |
        npm install -g "yarn@$(node -p 'require("./package.json").volta.yarn')" --force
        yarn install --frozen-lockfile
        yarn playwright install --with-deps chromium

    # Directory-based `yarn lint` does not discover these .cjs runners.
    # Include the shared browser helpers as well as their check runners and fixtures.
    - name: Lint browser checks
      timeout-minutes: 5
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      run: yarn lint-browser-checks

    - name: Check browser route capture
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 1
      run: node --test frontend/build/capture-browser-route.test.cjs

    - name: Check author photos
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        CHAPTARR_PHOTO_RESPONSE: ${{ runner.temp }}/author-photo-response.json
        TMPDIR: ${{ runner.temp }}
      run: yarn check-author-photo

    - name: Upload author photo evidence
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: author-photo-evidence
        path: |
          ${{ runner.temp }}/author-photo-response.json
          ${{ runner.temp }}/chaptarr-photo-*/*.png
        retention-days: 7
        if-no-files-found: warn

    # Covers the delete checkbox, the outgoing request body and the mobile layout.
    # It does NOT prove filesystem deletion is safe -- the Core deletion fixtures do.
    - name: Check author delete UI
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-author-delete

    - name: Check author search confirmation
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-author-search

    - name: Check author sync controls
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
        CHAPTARR_SYNC_ONLY: '1'
      run: yarn check-author-search

    - name: Check author-entry
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-author-entry

    - name: Check book-route-guards
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-book-route-guards

    - name: Check header-search
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-header-search

    - name: Check indexer-nfo
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-indexer-nfo

    - name: Check ConfirmModal Enter behavior
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-confirm-modal

    - name: Check manual import replacement confirmation
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-manual-import-confirmation

    - name: Check installed-release popup
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-update-popup

    - name: Check book-file deletion preview
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-book-file-delete

    - name: Check Wanted Authors table and actions
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
        CHAPTARR_LAYOUT_ARTIFACTS: ${{ runner.temp }}/chaptarr-wanted-authors-evidence
      run: yarn check-wanted-authors

    - name: Upload Wanted Authors evidence
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wanted-authors-evidence
        path: ${{ runner.temp }}/chaptarr-wanted-authors-evidence/*
        retention-days: 7
        if-no-files-found: warn

    - name: Check book-cover-scope
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-book-cover-scope

    - name: Check media-management-cover-scope
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-media-management-cover-scope

    - name: Check import-lists
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-import-lists

    - name: Check backups
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-backups

    - name: Check notification-upgrade
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-notification-upgrade

    - name: Check smart-narrator
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
      run: yarn check-smart-narrator

    - name: Upload cover settings evidence
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cover-settings-evidence
        path: ${{ runner.temp }}/chaptarr-cover-scope-*.png
        retention-days: 7
        if-no-files-found: warn

    - name: Upload author delete evidence
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: author-delete-evidence
        path: ${{ runner.temp }}/chaptarr-delete-ui-*/*.png
        retention-days: 7
        if-no-files-found: warn
    
    - name: Check mobile toolbar
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.browser_deps.outcome == 'success' }}
      timeout-minutes: 5
      env:
        TMPDIR: ${{ runner.temp }}
        CHAPTARR_LAYOUT_ARTIFACTS: ${{ runner.temp }}/chaptarr-toolbar-evidence
      run: yarn check-mobile-toolbar

    - name: Upload mobile toolbar evidence
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: mobile-toolbar-evidence
        path: ${{ runner.temp }}/chaptarr-toolbar-evidence/*.png
        retention-days: 7
        if-no-files-found: warn

    - name: Publish
      run: |
        dotnet publish src/NzbDrone.Console/Chaptarr.Console.csproj -c Release -f net10.0 -o ./publish/Chaptarr
        dotnet publish src/NzbDrone.Update/Chaptarr.Update.csproj -c Release -f net10.0 -o ./publish/Chaptarr/Chaptarr.Update
    
    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: chaptarr-${{ matrix.platform }}
        path: ./publish/
        retention-days: 7
        if-no-files-found: error

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHAPTARR_REQUIRE_POSTGRES: 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chaptarr
          POSTGRES_PASSWORD: chaptarr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chaptarr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 10.0.x

    - name: Install PostgreSQL client
      shell: bash
      run: |
        set -euo pipefail
        sudo sh build-tools/install-postgres-clients.sh

    - name: Create databases
      shell: bash
      env:
        PGPASSWORD: chaptarr
      run: |
        set -euo pipefail
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-main";'
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-log";'
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-cache";'

    - name: Restore dependencies
      run: dotnet restore src/Chaptarr.NoTests.sln

    - name: Build (migrations smoke)
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore

    - name: Check Core test runner
      run: python3 -m unittest discover -s build-tools -p test_run_core_tests.py

    - name: Build Core tests
      run: dotnet build src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release

    - name: Test - Core suite with PostgreSQL required
      timeout-minutes: 60
      env:
        CHAPTARR_TEST_POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Database=postgres;Username=chaptarr;Password=chaptarr;Pooling=false"
      run: python3 build-tools/run-core-tests.py --results TestResults/postgres --workers 6

    - name: Upload PostgreSQL test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: core-tests-postgres
        path: TestResults/postgres

    - name: Smoke - migrate up on fresh PostgreSQL
      shell: bash
      env:
        Chaptarr__Postgres__Host: localhost
        Chaptarr__Postgres__Port: 5432
        Chaptarr__Postgres__User: chaptarr
        Chaptarr__Postgres__Password: chaptarr
        Chaptarr__Postgres__MainDb: chaptarr-main
        Chaptarr__Postgres__LogDb: chaptarr-log
        Chaptarr__Postgres__CacheDb: chaptarr-cache
        Chaptarr__Server__BindAddress: 127.0.0.1
        Chaptarr__Server__Port: 8789
      run: |
        set -euo pipefail

        DATA_DIR="$(mktemp -d)"
        echo "Using data dir: $DATA_DIR"

        dotnet run --project src/NzbDrone.Console/Chaptarr.Console.csproj -c Release --no-build --framework net10.0 -- \
          /nobrowser "/data=$DATA_DIR" > app.log 2>&1 &
        pid=$!

        ready=""
        for i in $(seq 1 90); do
          if curl -fsS "http://127.0.0.1:8789/ping" >/dev/null 2>&1; then
            ready="yes"
            break
          fi
          sleep 1
        done

        kill "$pid" >/dev/null 2>&1 || true
        wait "$pid" >/dev/null 2>&1 || true

        if [ "$ready" != "yes" ]; then
          echo "Chaptarr failed to start or /ping did not become ready."
          tail -n 400 app.log || true
          exit 1
        fi

        echo "PostgreSQL migrations smoke test passed."
