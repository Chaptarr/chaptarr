name: Build ChaptarrNG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

# Tests only, never publishes. PRs and merges are both validated automatically, but
# nothing reaches users until release.yml is run by hand; docker-publish.yml is
# workflow_call-only, so no run started here can push an image.

# One live run per PR and per branch: a newer push supersedes the older run, so a
# batch of merges costs one build of the combined result rather than one each.
# Release-called runs are never cancelled - that would silently drop the gate.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  release-notes:
    name: Release-note contract
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.21.0
        package-manager-cache: false

    - name: Validate release-note fragment or explicit opt-out
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BODY: ${{ github.event.pull_request.body }}
      shell: bash
      run: |
        set -euo pipefail
        body_file="$RUNNER_TEMP/pr-body.md"
        printf '%s' "$PR_BODY" > "$body_file"
        node scripts/check-release-notes.mjs \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" \
          --pr-body "$body_file" \
          --summary-file "$GITHUB_STEP_SUMMARY"
        node scripts/preview-release-notes.mjs \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: osx

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Guard (repo) - no merge-conflict markers
      shell: bash
      run: |
        if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
          echo "Merge-conflict markers found in tracked files."
          exit 1
        fi
        python -c "import json; json.load(open('package.json', encoding='utf-8'))"

    - name: Guard (version) - package.json and Directory.Build.props in sync
      shell: bash
      run: python3 build-tools/version_guard.py sync

    - name: Guard (version) - no decreases on main
      if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          COMPARE_REF="origin/main"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              COMPARE_REF="HEAD^"
              echo "No ChaptarrNG release tag exists yet; comparing against the parent commit for the initial fork release."
            else
              echo "No reachable version tag or parent commit is available for monotonic version comparison."
              exit 1
            fi
          fi
        fi

        python3 build-tools/version_guard.py monotonic \
          --compare-ref "$COMPARE_REF" \
          --event-path "$GITHUB_EVENT_PATH"

    - name: Guard (version) - version-only commits stay pure
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          COMPARE_REF="origin/${{ github.base_ref }}"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              COMPARE_REF="HEAD^"
              echo "No ChaptarrNG release tag exists yet; checking version-only commit hygiene from the parent commit."
            else
              echo "No reachable version tag or parent commit is available for version-only commit hygiene."
              exit 1
            fi
          fi
        fi

        python3 build-tools/version_guard.py commit-hygiene --compare-ref "$COMPARE_REF"
    
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      if: runner.os == 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('src/NuGet.config', 'src/Directory.Packages.props', 'src/Directory.Build.props', 'src/Directory.Build.targets', 'src/Targets/**/*.targets', 'src/Chaptarr.NoTests.sln', 'src/**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-nuget-
    
    # FFmpeg is intentionally not downloaded in this compile/test workflow.
    # Source builds resolve bundled tools first and then the system PATH; explicit
    # native packaging owns bundled-tool acquisition and validation.

    - name: Restore dependencies
      run: |
        dotnet restore src/Chaptarr.NoTests.sln
        dotnet restore src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj
    
    - name: Build
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release --no-restore --verbosity normal
    
    - name: Publish
      run: |
        dotnet publish src/NzbDrone.Console/Chaptarr.Console.csproj -c Release -f net10.0 -o ./publish/Chaptarr
        dotnet publish src/NzbDrone.Update/Chaptarr.Update.csproj -c Release -f net10.0 -o ./publish/Chaptarr/Chaptarr.Update
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chaptarrng-${{ matrix.platform }}
        path: ./publish/
        retention-days: 7
        if-no-files-found: error

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chaptarr
          POSTGRES_PASSWORD: chaptarr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chaptarr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 10.0.x

    - name: Install PostgreSQL client
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Create databases
      shell: bash
      env:
        PGPASSWORD: chaptarr
      run: |
        set -euo pipefail
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-main";'
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-log";'
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-cache";'

    - name: Restore dependencies
      run: dotnet restore src/Chaptarr.NoTests.sln

    - name: Build (migrations smoke)
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore

    - name: Smoke - migrate up on fresh PostgreSQL
      shell: bash
      env:
        Chaptarr__Postgres__Host: localhost
        Chaptarr__Postgres__Port: 5432
        Chaptarr__Postgres__User: chaptarr
        Chaptarr__Postgres__Password: chaptarr
        Chaptarr__Postgres__MainDb: chaptarr-main
        Chaptarr__Postgres__LogDb: chaptarr-log
        Chaptarr__Postgres__CacheDb: chaptarr-cache
        Chaptarr__Server__BindAddress: 127.0.0.1
        Chaptarr__Server__Port: 8789
      run: |
        set -euo pipefail

        DATA_DIR="$(mktemp -d)"
        echo "Using data dir: $DATA_DIR"

        dotnet run --project src/NzbDrone.Console/Chaptarr.Console.csproj -c Release --no-build --framework net10.0 -- \
          /nobrowser "/data=$DATA_DIR" > app.log 2>&1 &
        pid=$!

        ready=""
        for i in $(seq 1 90); do
          if curl -fsS "http://127.0.0.1:8789/ping" >/dev/null 2>&1; then
            ready="yes"
            break
          fi
          sleep 1
        done

        kill "$pid" >/dev/null 2>&1 || true
        wait "$pid" >/dev/null 2>&1 || true

        if [ "$ready" != "yes" ]; then
          echo "Chaptarr failed to start or /ping did not become ready."
          tail -n 400 app.log || true
          exit 1
        fi

        echo "PostgreSQL migrations smoke test passed."
