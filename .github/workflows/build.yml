# ng-runner-policy: trusted-hosted-or-private-jit-v1
# packer-windows-jit-v1
name: Build ChaptarrNG
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' &&
      format('owner-pr:{0}:{1}:{2}:action:{3}:pool:{4}', inputs.pr_number, inputs.pr_sha,
        inputs.target_run_id, inputs.action, inputs.runner_pool) ||
      (github.event_name == 'workflow_dispatch' &&
       format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool)) || github.workflow }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      runner_pool:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      action:
        description: Run trusted CI or a release validation
        required: true
        type: choice
        options:
          - ci
      runner_pool:
        description: Select compatible GitHub-hosted or private JIT runners
        required: true
        type: choice
        default: public
        options:
          - public
          - private
      windows_chocolatey_only:
        description: Run only the Windows Chocolatey BookshelfNG migration acceptance
        required: false
        type: boolean
        default: false
      rpm_bridge_only:
        description: Run only the Fedora 44 RPM BookshelfNG migration acceptance
        required: false
        type: boolean
        default: false
      runner_policy_only:
        description: Run only the private runner policy regression on Linux JIT
        required: false
        type: boolean
        default: false
      channel_contracts_only:
        description: Run only the legacy distribution and runner contract suite
        required: false
        type: boolean
        default: false
      pr_number:
        description: Trusted same-repository owner PR number
        required: false
        type: string
      pr_sha:
        description: Exact owner PR head SHA
        required: false
        type: string
      target_run_id:
        description: Metadata-only pull_request_target run ID
        required: false
        type: string

# Build validation runs from an explicit main-branch hosted/private dispatch or
# an exact release tag passed through the main-branch reusable workflow call.
# Trusted owner PRs use a metadata-only private-JIT route.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-notes:
    name: Release-note contract
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'ci' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        github.event_name == 'pull_request_target' &&
        github.actor == 'snapetech' &&
        github.event.pull_request.user.login == 'snapetech' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.id == github.repository_id &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.user.type != 'Bot' &&
        contains(github.event.pull_request.labels.*.name, 'action:ci') &&
        contains(github.event.pull_request.labels.*.name, 'pool:private') &&
        (github.event.action != 'edited' || github.event.changes.body != null)
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-release-notes"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Validate release-note fragment or explicit opt-out
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BODY: ${{ github.event.pull_request.body }}
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
        if ! git cat-file -e "${HEAD_SHA}^{commit}"; then
          echo "::error::Pull request head ${HEAD_SHA} is unavailable after fetching refs/pull/${PR_NUMBER}/head"
          exit 1
        fi
        body_file="$RUNNER_TEMP/pr-body.md"
        printf '%s' "$PR_BODY" > "$body_file"
        node --test scripts/release-notes.test.mjs
        node scripts/check-release-notes.mjs \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" \
          --pr-body "$body_file" \
          --summary-file "$GITHUB_STEP_SUMMARY"
        node scripts/preview-release-notes.mjs \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    if: >-
      (
        github.ref == 'refs/heads/main' &&
        inputs.action == 'ci' &&
        (inputs.runner_pool == 'private' || inputs.runner_pool == 'public') &&
        inputs.pr_number == '' &&
        inputs.runner_policy_only != true &&
        inputs.rpm_bridge_only != true &&
        inputs.channel_contracts_only != true
      ) || (
        github.ref == 'refs/heads/main' &&
        inputs.action == 'publish' &&
        inputs.runner_pool == 'private' &&
        inputs.release_tag != '' &&
        inputs.release_sha != ''
      )
    # Public CI uses native x64 hosted runners. The explicit private route stays
    # available for jobs that need the JIT environment or exact runner receipt.
    runs-on: >-
      ${{ inputs.runner_pool == 'public' &&
          (matrix.platform == 'windows-x64' && 'windows-2025' ||
           matrix.platform == 'macos-intel' && 'macos-15-intel' ||
           'ubuntu-24.04') ||
          (matrix.platform == 'windows-x64' && fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","ChaptarrNG","gha-{0}-{1}-build"]}}', github.run_id, strategy.job-index)) ||
           matrix.platform == 'macos-intel' && fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","X64","private-apple","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-{1}-build"]}}', github.run_id, strategy.job-index)) ||
           fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}"]}}', github.run_id))) }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.windows_chocolatey_only && fromJSON('["windows-x64"]') || fromJSON('["linux-x64","windows-x64","macos-intel"]') }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.action == 'publish' && inputs.runner_pool == 'private' && inputs.release_tag != '' && inputs.release_sha || github.sha }}
        fetch-depth: 0

    - name: Verify exact release tag source
      if: inputs.action == 'publish'
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        RELEASE_SHA: ${{ inputs.release_sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"

    - name: Select Python executable for native runner
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
          python_command=python
        else
          python_command=python3
        fi
        command -v "$python_command" >/dev/null
        printf 'CHAPTARRNG_PYTHON=%s\n' "$python_command" >> "$GITHUB_ENV"

    - name: Test stable GHCR image identity and legacy aliases
      if: matrix.platform == 'linux-x64'
      run: |
        bash packaging/scripts/test-publish-image-aliases.sh
        bash packaging/scripts/test-dispatch-ghcr-release-bridge.sh
        bash packaging/scripts/test-release-readiness-gate.sh
        bash packaging/scripts/test-bookshelfng-deb-publish-gate.sh
        bash packaging/scripts/test-bookshelfng-ppa-publish-gate.sh

    - name: Test release publisher configuration preflight
      if: matrix.platform == 'linux-x64'
      env:
        TMPDIR: ${{ runner.temp }}
      run: bash packaging/scripts/test-release-publisher-config.sh

    - name: Test Chocolatey legacy package publish gate
      if: matrix.platform == 'windows-x64'
      shell: pwsh
      run: ./packaging/scripts/test-chocolatey-publish-gate.ps1

    - name: Test Chocolatey BookshelfNG migration choice
      if: matrix.platform == 'windows-x64'
      shell: pwsh
      run: ./packaging/scripts/test-chocolatey-migration-choice.ps1

    - name: Test BookshelfNG migration journal fingerprints and desktop PostgreSQL handoff
      if: matrix.platform == 'linux-x64'
      env:
        TASK_SCRATCH_DIR: ${{ runner.temp }}
      run: bash packaging/scripts/test-bookshelfng-journal-fingerprint.sh

    - name: Test workflow runner policy
      if: matrix.platform == 'linux-x64'
      run: python3 scripts/test_workflow_runner_policy.py

    - name: Test candidate BookshelfNG Debian bridge package
      if: matrix.platform == 'linux-x64'
      env:
        TASK_SCRATCH_DIR: ${{ runner.temp }}/chaptarrng-deb-bridge-test
      run: bash packaging/scripts/test-build-bookshelfng-deb-bridge.sh

    - name: Test BookshelfNG AUR migration choice
      if: matrix.platform == 'linux-x64'
      env:
        TASK_SCRATCH_DIR: ${{ runner.temp }}/chaptarrng-aur-choice-test
      run: bash packaging/scripts/test-bookshelfng-aur-choice.sh

    - name: Test candidate BookshelfNG RPM bridge package
      if: matrix.platform == 'linux-x64'
      env:
        TASK_SCRATCH_DIR: ${{ runner.temp }}/chaptarrng-rpm-bridge-test
      run: bash packaging/scripts/test-build-bookshelfng-rpm-bridge.sh

    - name: Test candidate BookshelfNG Launchpad source package
      if: matrix.platform == 'linux-x64'
      env:
        TASK_SCRATCH_DIR: ${{ runner.temp }}/chaptarrng-ppa-source-test
      run: bash packaging/scripts/test-build-bookshelfng-ppa-source.sh

    - name: Test BookshelfNG host migration helper
      if: matrix.platform == 'linux-x64'
      run: |
        bash -n scripts/bookshelfng-to-chaptarrng.sh scripts/test-bookshelfng-to-chaptarrng.sh
        bash scripts/test-bookshelfng-to-chaptarrng.sh

    - name: Test Linux systemd standalone Yes/No handoff prompt
      if: matrix.platform == 'linux-x64'
      run: python3 scripts/test_bookshelfng_systemd_bootstrap_prompt.py

    - name: Test BookshelfNG migration supervisor and single image
      if: matrix.platform == 'linux-x64'
      env:
        TMPDIR: ${{ runner.temp }}
      run: bash packaging/scripts/test-docker-bookshelf-compatibility-defaults.sh

    - name: Test legacy environment compatibility for unmapped retry
      if: matrix.platform == 'linux-x64'
      env:
        TMPDIR: ${{ runner.temp }}
      run: bash scripts/test-chaptarr-retry-unmapped-env.sh

    - name: Configure .NET install directory
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p -- "$RUNNER_TEMP/dotnet"
        printf 'DOTNET_INSTALL_DIR=%s/dotnet\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"


    - name: Guard (repo) - no merge-conflict markers
      shell: bash
      run: |
        if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
          echo "Merge-conflict markers found in tracked files."
          exit 1
        fi
        python -c "import json; json.load(open('package.json', encoding='utf-8'))"

    - name: Guard (version) - package.json and Directory.Build.props in sync
      shell: bash
      run: >-
        "$CHAPTARRNG_PYTHON" build-tools/version_guard.py sync

    - name: Guard (.NET SDK) - workflow and container pins match global.json
      shell: bash
      run: >-
        "$CHAPTARRNG_PYTHON" scripts/check_dotnet_sdk_pins.py

    - name: Guard (version) - no decreases on main
      if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          COMPARE_REF="origin/main"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              COMPARE_REF="HEAD^"
              echo "No ChaptarrNG release tag exists yet; comparing against the parent commit for the initial fork release."
            else
              echo "No reachable version tag or parent commit is available for monotonic version comparison."
              exit 1
            fi
          fi
        fi

        "$CHAPTARRNG_PYTHON" build-tools/version_guard.py monotonic \
          --compare-ref "$COMPARE_REF" \
          --event-path "$GITHUB_EVENT_PATH"

    - name: Guard (version) - version-only commits stay pure
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail

        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          COMPARE_REF="origin/${BASE_REF}"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              COMPARE_REF="HEAD^"
              echo "No ChaptarrNG release tag exists yet; checking version-only commit hygiene from the parent commit."
            else
              echo "No reachable version tag or parent commit is available for version-only commit hygiene."
              exit 1
            fi
          fi
        fi

        "$CHAPTARRNG_PYTHON" build-tools/version_guard.py commit-hygiene --compare-ref "$COMPARE_REF"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1

    - name: Test Quickstart setup readiness
      run: node --test frontend/src/System/Quickstart/quickstartReadiness.test.cjs

    - name: Install Yarn
      run: npm install --global yarn@1.22.22

    - name: Install frontend dependencies
      run: yarn install --frozen-lockfile --network-timeout 120000

    - name: Check translation calls and locale catalogs
      if: inputs.windows_chocolatey_only != true
      run: yarn check-translations && yarn check-localization

    - name: Test locale formatting and RTL CSS
      if: inputs.windows_chocolatey_only != true
      run: yarn test-localization

    - name: Verify bundled asset URLs remain same-origin
      run: node --test frontend/src/indexTemplateAssetUrls.test.cjs

    - name: Test Books list both-format filtering
      run: >-
        node --test
        frontend/src/Book/Index/getBookIndexQuery.test.cjs
        frontend/src/Book/Index/BookIndex.test.cjs

    - name: Test book infinite-scroll id deduplication
      run: node --test frontend/src/Store/Reducers/bookInfiniteScrollReducer.test.cjs

    - name: Test BookshelfNG workflow request state and controls
      run: >-
        node --test
        frontend/src/Book/Delete/DeleteBookModalContentConnector.test.cjs
        frontend/src/Book/Details/BookDetailRequests.test.cjs
        frontend/src/Book/Index/Overview/BookIndexOverview.test.cjs
        frontend/src/Book/Index/BookIndexAuthorEditorFormat.test.cjs
        frontend/src/Bookshelf/BookshelfFooter.test.cjs
        frontend/src/Components/Form/ProfileSelectInputConnectors.test.cjs
        frontend/src/Settings/MediaManagement/MediaManagement.test.cjs
        frontend/src/Settings/MediaManagement/RootFolder/RootFolders.test.cjs
        frontend/src/Store/Actions/createBookMonitoringFailureAction.test.cjs
        frontend/src/System/Updates/UpdateChanges.test.cjs

    - name: Test client-side collection equality
      run: node --test frontend/src/Utilities/Object/clientSideCollectionEqual.test.cjs

    - name: Check React Router context
      run: yarn check-react-router-context

    - name: Type-check frontend
      run: yarn typecheck

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 10.0.403

    - name: Cache NuGet packages
      # Manual release dispatch can select a branch; do not let those builds write shared cache entries.
      if: runner.os == 'Windows' && github.event_name != 'workflow_dispatch'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('src/NuGet.config', 'src/Directory.Packages.props', 'src/Directory.Build.props', 'src/Directory.Build.targets', 'src/Targets/**/*.targets', 'src/Chaptarr.NoTests.sln', 'src/**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-nuget-
    
    # FFmpeg is intentionally not downloaded in this compile/test workflow.
    # Source builds resolve bundled tools first and then the system PATH; explicit
    # native packaging owns bundled-tool acquisition and validation.

    - name: Restore dependencies
      run: |
        dotnet restore src/Chaptarr.NoTests.sln
        dotnet restore src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj
    
    - name: Build
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore

    - name: Build test assembly
      run: dotnet build src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release --no-restore -p:UseSharedCompilation=false

    - name: Build tool-enabled M4B test image
      if: matrix.platform == 'linux-x64'
      run: docker build -f integration/Dockerfile.m4b-test -t chaptarrng-m4b-test:ci integration

    - name: Test real M4B merge, fallback, and restart recovery
      if: matrix.platform == 'linux-x64'
      run: |
        docker run --rm --network none \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace/_tests/net10.0 \
          chaptarrng-m4b-test:ci \
          dotnet vstest Chaptarr.Core.Test.dll \
            --TestCaseFilter:"FullyQualifiedName~real_m4b_tool_should_" \
            --Logger:"console;verbosity=normal"

    - name: Configure Chromium cache for direct-download browser tests
      if: runner.os == 'Linux'
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      run: echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

    - name: Install Chromium and system dependencies on Linux
      if: runner.os == 'Linux'
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      shell: bash
      run: |
        set -euo pipefail
        driver=./_tests/net10.0/.playwright
        test -x "$driver/node/linux-x64/node"
        test -f "$driver/package/cli.js"
        PW_LANG_NAME=csharp "$driver/node/linux-x64/node" "$driver/package/cli.js" install --with-deps chromium

    - name: Verify Unraid package sync stays off feature branches
      shell: bash
      run: bash scripts/test-sync-unraid-package.sh

    - name: Verify BookshelfNG legacy distribution contracts
      run: node --test packaging/scripts/test-bookshelf-legacy-channels.mjs

    - name: Verify Linux desktop-candidate staging
      if: runner.os == 'Linux'
      shell: bash
      run: |
        bash -n packaging/scripts/prepare-bookshelf-desktop-candidates.sh \
          packaging/scripts/build-bookshelf-desktop-candidates.sh \
          packaging/scripts/test-prepare-bookshelf-desktop-candidates.sh \
          packaging/scripts/test-build-bookshelf-desktop-candidates.sh
        bash packaging/scripts/test-prepare-bookshelf-desktop-candidates.sh
        bash packaging/scripts/test-build-bookshelf-desktop-candidates.sh

    - name: Verify digest-pinned BookshelfNG container-platform candidates
      if: runner.os == 'Linux'
      env:
        TASK_SCRATCH_DIR: ${{ runner.temp }}/chaptarrng-container-candidates-test
      run: |
        bash -n packaging/scripts/build-bookshelf-container-platform-candidates.sh \
          packaging/scripts/test-build-bookshelf-container-platform-candidates.sh
        bash packaging/scripts/test-build-bookshelf-container-platform-candidates.sh

    - name: Test BookshelfNG StartOS artifact handoff
      if: runner.os == 'Linux'
      env:
        TASK_SCRATCH_DIR: ${{ runner.temp }}/chaptarrng-startos-artifact-test
      run: |
        for script in \
          packaging/scripts/build-bookshelf-container-platform-candidates.sh \
          packaging/scripts/build-bookshelf-startos-artifacts.sh \
          packaging/legacy/startos/candidate/build-startos-package.sh \
          packaging/scripts/test-build-bookshelf-startos-artifacts.sh; do
          bash -n "$script"
        done
        bash packaging/scripts/test-build-bookshelf-startos-artifacts.sh

    - name: Test
      env:
        DIRECT_DOWNLOAD_REQUIRE_PLAYWRIGHT: ${{ runner.os == 'Linux' && 'true' || 'false' }}
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      run: dotnet test src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release --no-restore --no-build --verbosity normal

    # CSS Modules generation rewrites tracked declaration files, so build the UI
    # after the tests have finished.
    - name: Build frontend
      run: yarn build
    
    - name: Publish
      run: |
        dotnet publish src/NzbDrone.Console/Chaptarr.Console.csproj -c Release -f net10.0 -o ./publish/Chaptarr
        dotnet publish src/NzbDrone.Update/Chaptarr.Update.csproj -c Release -f net10.0 -o ./publish/Chaptarr/Chaptarr.Update

    - name: Include and verify frontend in artifact
      shell: bash
      run: |
        set -euo pipefail
        test -s ./_output/UI/index.html
        mkdir -p ./publish/Chaptarr/UI
        cp -a ./_output/UI/. ./publish/Chaptarr/UI/
        test -s ./publish/Chaptarr/UI/index.html

    - name: Verify optional diagnostics module in artifact
      shell: bash
      run: test -s ./publish/Chaptarr/Chaptarr.Diagnostics.dll

    - name: Build Windows BookshelfNG migration installer
      if: matrix.platform == 'windows-x64'
      shell: pwsh
      run: ./packaging/scripts/build-windows-bookshelf-migration-installer.ps1 -KeepPayload

    - name: Test Windows migration installer SQLite fingerprint
      if: matrix.platform == 'windows-x64'
      shell: pwsh
      run: dotnet run --configuration Release --project ./distribution/windows/installer-net-smoke/ChaptarrNG.Installer.Smoke.csproj

    - name: Test Windows BookshelfNG installer upgrade and rollback services
      if: matrix.platform == 'windows-x64'
      env:
        CHAPTARR_SERVICE_ROUNDTRIP_CLEANUP_MANIFEST: ${{ runner.temp }}/chaptarr-bookshelf-service-roundtrip-cleanup.json
      shell: pwsh
      run: dotnet run --configuration Release --project ./distribution/windows/installer-net-smoke/ChaptarrNG.Installer.Smoke.csproj -- --windows-service-round-trip

    - name: Clean up Windows BookshelfNG installer round-trip services
      if: always() && matrix.platform == 'windows-x64'
      env:
        CHAPTARR_SERVICE_ROUNDTRIP_CLEANUP_MANIFEST: ${{ runner.temp }}/chaptarr-bookshelf-service-roundtrip-cleanup.json
      shell: pwsh
      run: ./distribution/windows/installer-net-smoke/CleanupServiceRoundTrip.ps1 -ManifestPath $env:CHAPTARR_SERVICE_ROUNDTRIP_CLEANUP_MANIFEST

    - name: Test Windows service preserves its selected data directory
      if: matrix.platform == 'windows-x64'
      shell: pwsh
      run: ./packaging/scripts/test-windows-service-data-path.ps1 -AppDirectory ./publish/Chaptarr

    - name: Test Chocolatey BookshelfNG .76 to exact candidate handoff
      if: matrix.platform == 'windows-x64' && github.event_name == 'workflow_dispatch'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        [xml] $buildProperties = Get-Content -LiteralPath 'src/Directory.Build.props' -Raw
        $assemblyVersion = $buildProperties.SelectSingleNode("//*[local-name()='AssemblyVersion']").InnerText
        $versionMatch = [regex]::Match($assemblyVersion, '^(?<version>\d+\.\d+\.\d+)\.0$')
        if (-not $versionMatch.Success) {
          throw "Could not derive the three-part Chocolatey candidate version from AssemblyVersion $assemblyVersion."
        }
        $version = $versionMatch.Groups['version'].Value
        $appDirectory = (Resolve-Path -LiteralPath './publish/Chaptarr').Path
        $archiveDirectory = Join-Path $env:RUNNER_TEMP 'chocolatey-bookshelfng-candidate'
        New-Item -ItemType Directory -Force -Path $archiveDirectory | Out-Null
        $archive = Join-Path $archiveDirectory "ChaptarrNG-$version-win-x64.zip"
        if (Test-Path -LiteralPath $archive) { throw "The candidate archive already exists: $archive" }
        Compress-Archive -Path (Join-Path $appDirectory '*') -DestinationPath $archive -CompressionLevel Optimal
        ./packaging/scripts/test-chocolatey-bookshelfng-handoff.ps1 -Version $version -ArchivePath $archive
        Remove-Item -LiteralPath $archive -Force
        if (-not (Get-ChildItem -LiteralPath $archiveDirectory -Force | Select-Object -First 1)) {
          Remove-Item -LiteralPath $archiveDirectory -Force
        }

    - name: Stage failed Windows Chocolatey handoff diagnostics
      if: >-
        failure() && matrix.platform == 'windows-x64' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.windows_chocolatey_only == true
      shell: pwsh
      run: |
        $artifactDirectory = Join-Path $env:RUNNER_TEMP 'bookshelfng-windows-installed-handoff-${{ github.run_id }}'
        New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
        $handoffDirectory = Join-Path $env:RUNNER_TEMP 'chocolatey-bookshelfng-handoff-${{ github.run_id }}'
        if (Test-Path -LiteralPath $handoffDirectory) {
          Copy-Item -LiteralPath $handoffDirectory -Destination (Join-Path $artifactDirectory 'runner-temp') -Recurse -Force
        }
        $programDataDirectory = Join-Path $env:ProgramData 'BookshelfNG'
        if (Test-Path -LiteralPath $programDataDirectory) {
          Copy-Item -LiteralPath $programDataDirectory -Destination (Join-Path $artifactDirectory 'programdata') -Recurse -Force
        }

    - name: Upload failed Windows Chocolatey handoff diagnostics
      if: >-
        failure() && matrix.platform == 'windows-x64' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.windows_chocolatey_only == true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: bookshelfng-windows-installed-handoff-${{ github.run_id }}
        path: ${{ runner.temp }}/bookshelfng-windows-installed-handoff-${{ github.run_id }}
        if-no-files-found: warn
        retention-days: 30

    - name: Remove temporary Windows installer payload
      if: always() && matrix.platform == 'windows-x64'
      shell: pwsh
      run: |
        $payload = Join-Path $PWD 'distribution/windows/installer-net/Payload/Chaptarr.payload.zip'
        if (Test-Path -LiteralPath $payload) {
          Remove-Item -LiteralPath $payload -Force
        }
        $payloadDirectory = Split-Path -Parent $payload
        if ((Test-Path -LiteralPath $payloadDirectory) -and
            -not (Get-ChildItem -LiteralPath $payloadDirectory -Force | Select-Object -First 1)) {
          Remove-Item -LiteralPath $payloadDirectory -Force
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: chaptarrng-${{ matrix.platform }}
        path: ./publish/
        retention-days: 7
        if-no-files-found: error

  rpm-bridge-acceptance:
    name: Fedora 44 BookshelfNG RPM No/Yes and rollback
