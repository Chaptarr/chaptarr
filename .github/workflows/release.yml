# ng-runner-policy: private-jit-only-v1
# packer-windows-jit-v1
name: Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action, inputs.runner_pool, inputs.release_tag) || github.workflow }}

# Select a stable release tag from a main-branch dispatch. The tag must match
# the main version, point to main, and is checked out exactly by each build.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Admit this release workflow to the private JIT broker
        required: true
        type: choice
        options:
          - publish
      runner_pool:
        description: Select the private ephemeral JIT pool
        required: true
        type: choice
        options:
          - private
      release_tag:
        description: Exact existing stable release tag to validate and build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'publish' &&
      inputs.runner_pool == 'private' &&
      inputs.release_tag != ''
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-preflight"]}}', github.run_id)) }}
    outputs:
      release_requested: ${{ steps.release-request.outputs.release_requested }}
      release_tag: ${{ steps.release-request.outputs.release_tag }}
      release_version: ${{ steps.release-request.outputs.release_version }}
      release_sha: ${{ steps.release-request.outputs.release_sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Validate the selected stable release tag
      id: release-request
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        ACTION: ${{ inputs.action }}
        RUNNER_POOL: ${{ inputs.runner_pool }}
      run: |
        set -euo pipefail
        TAG="$RELEASE_TAG"
        if [[ "$GITHUB_REF" != refs/heads/main || "$ACTION" != publish || "$RUNNER_POOL" != private ]]; then
          echo 'Releases require a main-branch workflow dispatch with action=publish and pool=private.' >&2
          exit 1
        fi
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tag $TAG must use stable vMAJOR.MINOR.PATCH syntax." >&2
          exit 1
        fi
        git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}" refs/heads/main:refs/remotes/origin/main
        VERSION="$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
        TAG_VERSION="$(git show "$TAG:package.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")"
        if [[ "$TAG" != "v$VERSION" || "$TAG_VERSION" != "$VERSION" ]]; then
          echo "Selected tag $TAG must match package.json version $VERSION on main and at the tag."
          exit 1
        fi
        RELEASE_SHA="$(git rev-parse "${TAG}^{commit}")"
        if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
          echo "Selected release tag $TAG does not point to a commit on main." >&2
          exit 1
        fi
        python3 packaging/scripts/check_stable_release_version.py
        if ! grep -qx 'release_requested=true' "$GITHUB_OUTPUT"; then
          echo "Selected tag $TAG is not newer than the latest published stable release."
          exit 1
        fi
        {
          echo "release_tag=$TAG"
          echo "release_version=$VERSION"
          echo "release_sha=$RELEASE_SHA"
        } >> "$GITHUB_OUTPUT"

    - name: Require retirement release readiness
      if: steps.release-request.outputs.release_requested == 'true'
      env:
        CHAPTARRNG_RELEASE_READY: ${{ vars.CHAPTARRNG_RELEASE_READY }}
        BOOKSHELFNG_RELEASE_READY: ${{ vars.BOOKSHELFNG_RELEASE_READY }}
      run: ./packaging/scripts/require-release-readiness.sh

    - name: Validate Discord release destination before publishing
      if: steps.release-request.outputs.release_requested == 'true'
      env:
        DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      run: bash packaging/scripts/validate-release-publisher-config.sh discord

  validate:
    if: needs.preflight.outputs.release_requested == 'true'
    needs: preflight
    uses: ./.github/workflows/build.yml
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: read
    with:
      action: publish
      runner_pool: private
      release_tag: ${{ needs.preflight.outputs.release_tag }}
      release_sha: ${{ needs.preflight.outputs.release_sha }}

  release:
    needs: [preflight, validate]
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        needs.preflight.outputs.release_requested == 'true'
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-release"]}}', github.run_id)) }}
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      release_body: ${{ steps.changelog.outputs.release_body }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.preflight.outputs.release_sha }}
        fetch-depth: 0
        persist-credentials: false

    - uses: ./.github/actions/setup-github-cli

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Install git-cliff
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: git-cliff

    - name: Resolve source head
      id: source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      run: |
        set -euo pipefail
        actual_sha="$(git rev-parse HEAD)"
        test "$actual_sha" = "$EXPECTED_RELEASE_SHA"
        echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

    - name: Guard - versions in sync
      run: python3 build-tools/version_guard.py sync

    - name: Resolve tag
      id: tag
      shell: bash
      env:
        RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      run: |
        set -euo pipefail
        VERSION="$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
        TAG="$RELEASE_TAG"
        if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" || "$VERSION" != "$RELEASE_VERSION" || "$TAG" != "v$VERSION" ]]; then
          echo "Checked-out tag $TAG does not match the validated release source and version."
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Guard - tag matches versions
      run: python3 build-tools/version_guard.py release-tag --tag "${{ steps.tag.outputs.tag }}"

    - name: Guard - release tag is on main
      env:
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
        if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
          echo "Release source $SOURCE_SHA is not on main."
          exit 1
        fi

    - name: Generate release notes
      id: changelog
      env:
        TAG: ${{ steps.tag.outputs.tag }}
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      shell: bash
      run: |
        set -euo pipefail

        releases_json="$RUNNER_TEMP/published-releases.json"
        gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt > "$releases_json"
        PREVIOUS_TAG="$(jq -r --arg current "$TAG" '
          [.[] | select(.isDraft == false and .isPrerelease == false and .tagName != $current and
            (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))]
          | sort_by(.publishedAt)
          | last
          | .tagName // empty
        ' "$releases_json")"
        if [[ -z "$PREVIOUS_TAG" ]]; then
          echo "No previously published stable release was found."
          exit 1
        fi

        git merge-base --is-ancestor "$PREVIOUS_TAG" "$SOURCE_SHA" || {
          echo "Previous release $PREVIOUS_TAG is not an ancestor of $SOURCE_SHA."
          exit 1
        }

        current_changelog="$RUNNER_TEMP/chaptarrng-current-changelog.md"
        git-cliff --config .github/cliff.toml --tag "$TAG" "$PREVIOUS_TAG..$SOURCE_SHA" \
          --output "$current_changelog"
        node scripts/assemble-release-notes.mjs \
          --previous-tag "$PREVIOUS_TAG" \
          --head "$SOURCE_SHA" \
          --changelog "$current_changelog" \
          --output "$current_changelog"
        grep -Eq '^## \[?[0-9]+\.[0-9]+\.[0-9]+' "$current_changelog" || {
          echo "Generated changelog is missing its release heading."
          exit 1
        }

        delimiter="release_body_$GITHUB_RUN_ID"
        {
          echo "release_body<<$delimiter"
          cat "$current_changelog"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: Verify pushed tag is immutable
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.tag.outputs.tag }}
        RELEASE_SHA: ${{ steps.source.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail
        REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}' || true)"
        if [[ -z "$REMOTE_SHA" ]]; then
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}' || true)"
        fi

        if gh release view "$TAG" --json isDraft --jq .isDraft >/dev/null 2>&1; then
          IS_PUBLISHED="$(gh release view "$TAG" --json isDraft --jq '.isDraft | not')"
          if [[ "$IS_PUBLISHED" == "true" ]]; then
            echo "Release $TAG is already published. Bump the version before creating another release."
            exit 1
          fi
        fi

        if [[ "$REMOTE_SHA" != "$RELEASE_SHA" ]]; then
          echo "Pushed tag $TAG points to $REMOTE_SHA, but this run checked out $RELEASE_SHA."
          exit 1
        fi

    - name: Create draft release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.tag.outputs.tag }}
        RELEASE_BODY: ${{ steps.changelog.outputs.release_body }}
      shell: bash
      run: |
        set -euo pipefail
        notes="$RUNNER_TEMP/chaptarrng-release-notes.md"
        printf '%s\n' "$RELEASE_BODY" > "$notes"

        if gh release view "$TAG" >/dev/null 2>&1; then
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "$TAG" \
              --title "ChaptarrNG $TAG" \
              --notes-file "$notes" \
              --draft=true \
              --prerelease=false
          else
            echo "Release $TAG is already published; leaving it published."
          fi
        else
          gh release create "$TAG" \
            --title "ChaptarrNG $TAG" \
            --notes-file "$notes" \
            --draft \
            --verify-tag
        fi

  # Images publish here and nowhere else, so merging PRs never ships an update.
  docker:
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      sha: ${{ needs.release.outputs.sha }}
      branch: main
      legacy_bridge_enabled: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}

  dispatch-legacy-ghcr:
    name: Dispatch personal-account BookshelfNG GHCR bridge
    needs: [release, docker, publish-release]
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true'
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-dispatch-legacy-ghcr"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-github-cli
      - name: Create scoped bridge-repository token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.CHAPTARRNG_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.CHAPTARRNG_AUTOMATION_APP_PRIVATE_KEY }}
          owner: snapetech
          repositories: bookshelfng-ghcr-release-bridge
          permission-contents: write
      - name: Dispatch verified image and migration-flavor digests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
          SOURCE_SHA: ${{ needs.release.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: bash packaging/scripts/dispatch-ghcr-release-bridge.sh

  platform-runtime-packs:
    name: Build Linux x86 and FreeBSD .NET 10 runtime packs
    needs: release
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-jit-linux-22-04","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-platform-runtime-packs"]}}', github.run_id)) }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: |
          10.0.110
          10.0.111
          10.0.403

    - name: Build pinned extra-platform runtime packs
      env:
        DOTNETVERSION: 10.0.403
        DOTNET_ROOT: ${{ runner.temp }}/dotnet
        PLATFORM_RUNTIME_WORK_DIR: ${{ runner.temp }}/chaptarrng-platform-runtime-work
        PLATFORM_RUNTIME_PACKS_OUTPUT: ${{ runner.temp }}/chaptarrng-platform-runtime-packs
      run: bash packaging/scripts/build-extra-platform-runtime-packs.sh

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chaptarrng-platform-runtime-packs
        path: ${{ runner.temp }}/chaptarrng-platform-runtime-packs/**
        retention-days: 7
        if-no-files-found: error

  standalone-assets:
    name: Build ${{ matrix.rid }} standalone release asset
    needs: [release, platform-runtime-packs]
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-{1}-standalone-assets"]}}', github.run_id, strategy.job-index)) }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64, win-x64, win-x86, linux-x86, freebsd-x64]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Build frontend
      run: |
        npm install --global yarn@1.22.22
        yarn install --frozen-lockfile
        yarn build

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 10.0.403

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ matrix.rid == 'linux-x86' || matrix.rid == 'freebsd-x64' }}
      with:
        name: chaptarrng-platform-runtime-packs
        path: ${{ runner.temp }}/platform-runtime-packs

    - name: Build standalone application archive
      env:
        CUSTOM_RUNTIME_PACKS_DIR: ${{ runner.temp }}/platform-runtime-packs/packages
        DOTNET_ROOT: ${{ runner.temp }}/dotnet
        DOTNETVERSION: 10.0.403
        VERSION: ${{ needs.release.outputs.version }}
        RID: ${{ matrix.rid }}
      run: bash packaging/scripts/build-standalone.sh "$VERSION" "$RID" "$RUNNER_TEMP/release-assets"

    - name: Verify archive and checksum sidecar
      env:
        VERSION: ${{ needs.release.outputs.version }}
        RID: ${{ matrix.rid }}
      run: |
        set -euo pipefail
        if [[ "$RID" == win-* ]]; then
          asset="ChaptarrNG-${VERSION}-${RID}.zip"
          unzip -t "$RUNNER_TEMP/release-assets/$asset" >/dev/null
        else
          asset="ChaptarrNG-${VERSION}-${RID}.tar.gz"
          tar -tzf "$RUNNER_TEMP/release-assets/$asset" >/dev/null
          if [[ "$RID" == linux-* || "$RID" == osx-* ]]; then
            tar -tzf "$RUNNER_TEMP/release-assets/$asset" \
              | grep -Fx 'ChaptarrNG/scripts/bookshelfng-to-chaptarrng.sh' >/dev/null
          fi
          if [[ "$RID" == linux-x64 || "$RID" == linux-arm64 ]]; then
            tar -tzf "$RUNNER_TEMP/release-assets/$asset" \
              | grep -Fx 'ChaptarrNG/scripts/bookshelfng-systemd-bootstrap.py' >/dev/null
          fi
        fi
        (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$asset.sha256")

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chaptarrng-standalone-${{ matrix.rid }}
        path: ${{ runner.temp }}/release-assets/*
        retention-days: 7
        if-no-files-found: error

  windows-migration-installer:
    name: Build BookshelfNG Windows migration installer
    needs: [preflight, release, standalone-assets]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'publish' &&
      inputs.runner_pool == 'private'
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","ChaptarrNG","gha-{0}-windows-migration-installer"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      shell: bash
      run: bash packaging/scripts/verify-release-source-sha.sh

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 10.0.403

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: chaptarrng-standalone-win-x64
        path: ${{ runner.temp }}/chaptarrng-standalone-win-x64

    - name: Build and verify the migration installer from the release payload
      shell: pwsh
      env:
        VERSION: ${{ needs.release.outputs.version }}
      run: |
        $appDirectory = Join-Path $env:RUNNER_TEMP 'chaptarrng-windows-migration-app'
        $installerOutput = Join-Path $env:RUNNER_TEMP 'chaptarrng-windows-migration-build'
        $assetOutput = Join-Path $env:RUNNER_TEMP 'chaptarrng-windows-migration-asset'
        New-Item -ItemType Directory -Force -Path $appDirectory, $assetOutput | Out-Null
        $archiveDirectory = Join-Path $env:RUNNER_TEMP 'chaptarrng-standalone-win-x64'
        $archive = Join-Path $archiveDirectory "ChaptarrNG-$env:VERSION-win-x64.zip"
        Expand-Archive -LiteralPath $archive -DestinationPath $appDirectory
        ./packaging/scripts/build-windows-bookshelf-migration-installer.ps1 -AppDirectory $appDirectory -InstallerOutput $installerOutput
        $assetName = "ChaptarrNG-$env:VERSION-bookshelfng-migration-installer-win-x64.exe"
        $source = Join-Path $installerOutput 'ChaptarrNG.Installer.exe'
        $destination = Join-Path $assetOutput $assetName
        Copy-Item -LiteralPath $source -Destination $destination
        $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
        Set-Content -LiteralPath "$destination.sha256" -Value "$hash  $assetName" -Encoding ascii
        if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
          throw 'The Windows migration installer checksum changed while preparing the release asset.'
        }

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chaptarrng-windows-migration-installer
        path: ${{ runner.temp }}/chaptarrng-windows-migration-asset/*
        retention-days: 7
        if-no-files-found: error

  legacy-desktop-candidates:
    name: Build gated BookshelfNG AppImage and Flatpak candidates
    needs: [release, standalone-assets]
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        always() && needs.release.result == 'success' && needs.standalone-assets.result == 'success'
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-legacy-desktop-candidates"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      with:
        name: chaptarrng-standalone-linux-x64
        path: ${{ runner.temp }}/linux-x64

    - name: Verify desktop candidate tools were installed by the private JIT broker
      if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      run: |
        set -euo pipefail
        for tool in flatpak flatpak-builder curl; do
          command -v "$tool" >/dev/null 2>&1 || {
            echo "$tool must be installed by the private JIT broker before this job starts." >&2
            exit 1
          }
        done
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --user --noninteractive --assumeyes flathub \
          org.freedesktop.Platform//26.08 \
          org.freedesktop.Sdk//26.08

    - name: Install pinned AppImage builder and runtime
      if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      env:
        APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
      run: |
        set -euo pipefail
        tool_directory="$RUNNER_TEMP/appimage-tools"
        mkdir -p "$tool_directory"
        appimagetool="$tool_directory/appimagetool"
        runtime="$tool_directory/runtime-x86_64"
        curl --fail --location --retry 3 \
          https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
          --output "$appimagetool"
        printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$appimagetool" | sha256sum --check
        curl --fail --location --retry 3 \
          https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
          --output "$runtime"
        printf '%s  %s\n' "$APPIMAGE_RUNTIME_SHA256" "$runtime" | sha256sum --check
        chmod 0755 "$appimagetool" "$runtime"
        echo "$tool_directory" >> "$GITHUB_PATH"
        echo 'APPIMAGE_EXTRACT_AND_RUN=1' >> "$GITHUB_ENV"
        echo "APPIMAGETOOL_RUNTIME_FILE=$runtime" >> "$GITHUB_ENV"

    - name: Build checksummed candidates from the verified Linux release asset
      if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      env:
        VERSION: ${{ needs.release.outputs.version }}
      run: |
        set -euo pipefail
        archive="ChaptarrNG-${VERSION}-linux-x64.tar.gz"
        (cd "$RUNNER_TEMP/linux-x64" && sha256sum --check "$archive.sha256")
        bash packaging/scripts/build-bookshelf-desktop-candidates.sh \
          "$RUNNER_TEMP/linux-x64/$archive" \
          "$RUNNER_TEMP/bookshelfng-desktop-candidates"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      with:
        name: chaptarrng-bookshelfng-desktop-candidates
        path: ${{ runner.temp }}/bookshelfng-desktop-candidates/ChaptarrNG-*
        retention-days: 7
        if-no-files-found: error

  rpm-source:
    name: Build verified new and legacy COPR source RPMs
    needs: [release, standalone-assets]
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-rpm-source"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: chaptarrng-standalone-linux-x64
        path: ${{ runner.temp }}/linux-x64

    - name: Verify RPM tools were installed by the private JIT broker
      run: |
        set -euo pipefail
        command -v rpmbuild >/dev/null 2>&1 || {
          echo 'RPM tools must be installed by the private JIT broker before this job starts.' >&2
          exit 1
        }

    - name: Build both package identities from the same ChaptarrNG release asset
      env:
        VERSION: ${{ needs.release.outputs.version }}
      run: |
        set -euo pipefail
        asset="ChaptarrNG-${VERSION}-linux-x64.tar.gz"
        VERSION="$VERSION" \
          ARCHIVE_PATH="$RUNNER_TEMP/linux-x64/$asset" \
          OUTPUT_DIR="$RUNNER_TEMP/rpm-source-output" \
          bash packaging/scripts/build-rpm-sources.sh

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chaptarrng-rpm-source
        path: |
          ${{ runner.temp }}/rpm-source-output/*.src.rpm
          ${{ runner.temp }}/rpm-source-output/*.src.rpm.sha256
        retention-days: 7
        if-no-files-found: error

  publish-release:
    needs: [preflight, release, docker, standalone-assets, rpm-source, windows-migration-installer, legacy-desktop-candidates]
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-publish-release"]}}', github.run_id)) }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - uses: ./.github/actions/setup-github-cli

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: chaptarrng-standalone-*
        merge-multiple: true
        path: ${{ runner.temp }}/release-assets

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: chaptarrng-rpm-source
        path: ${{ runner.temp }}/release-assets

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      with:
        name: chaptarrng-windows-migration-installer
        path: ${{ runner.temp }}/release-assets

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      with:
        name: chaptarrng-bookshelfng-desktop-candidates
        path: ${{ runner.temp }}/release-assets

    - name: Build the gated BookshelfNG Debian package asset
      if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      env:
        VERSION: ${{ needs.release.outputs.version }}
        ARCHIVE_PATH: ${{ runner.temp }}/release-assets/ChaptarrNG-${{ needs.release.outputs.version }}-linux-x64.tar.gz
        OUTPUT_DIR: ${{ runner.temp }}/bookshelfng-deb-bridge
      run: |
        set -euo pipefail
        archive="$(basename "$ARCHIVE_PATH")"
        (cd "$(dirname "$ARCHIVE_PATH")" && sha256sum --check "$archive.sha256")
        bash packaging/scripts/build-bookshelfng-deb-bridge.sh
        cp "$OUTPUT_DIR"/bookshelfng_*.deb "$RUNNER_TEMP/release-assets/"
        cp "$OUTPUT_DIR"/bookshelfng_*.deb.sha256 "$RUNNER_TEMP/release-assets/"

    - name: Build digest-pinned container-platform candidates
      if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      env:
        VERSION: ${{ needs.release.outputs.version }}
        CHAPTARRNG_IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
        OUTPUT_DIR: ${{ runner.temp }}/bookshelfng-container-platform-candidates
      run: |
        set -euo pipefail
        bash packaging/scripts/build-bookshelf-container-platform-candidates.sh
        asset="ChaptarrNG-${VERSION}-bookshelfng-container-platform-candidates.tar.gz"
        cp "$OUTPUT_DIR/$asset" "$RUNNER_TEMP/release-assets/"
        cp "$OUTPUT_DIR/$asset.sha256" "$RUNNER_TEMP/release-assets/"

    - name: Verify and attach release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.release.outputs.tag }}
        VERSION: ${{ needs.release.outputs.version }}
        LEGACY_BRIDGE_ENABLED: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      run: |
        set -euo pipefail
        release_state="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
        if [[ "$release_state" != "true" ]]; then
          echo "Refusing to mutate the published release $TAG."
          exit 1
        fi
        for rid in linux-x64 linux-arm64; do
          asset="ChaptarrNG-${VERSION}-${rid}.tar.gz"
          test -s "$RUNNER_TEMP/release-assets/$asset"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$asset.sha256")
        done
        asset="ChaptarrNG-${VERSION}-win-x64.zip"
        test -s "$RUNNER_TEMP/release-assets/$asset"
        (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$asset.sha256")
        if [[ "$LEGACY_BRIDGE_ENABLED" == true ]]; then
          migration_installer="ChaptarrNG-${VERSION}-bookshelfng-migration-installer-win-x64.exe"
          test -s "$RUNNER_TEMP/release-assets/$migration_installer"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$migration_installer.sha256")
          appimage="ChaptarrNG-${VERSION}-bookshelfng-x86_64.AppImage"
          test -s "$RUNNER_TEMP/release-assets/$appimage"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$appimage.sha256")
          flatpak="ChaptarrNG-${VERSION}-bookshelfng.flatpak"
          test -s "$RUNNER_TEMP/release-assets/$flatpak"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$flatpak.sha256")
        fi
        srpm="chaptarrng-${VERSION}-1.src.rpm"
        test -s "$RUNNER_TEMP/release-assets/$srpm"
        (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$srpm.sha256")
        legacy_srpm="bookshelfng-${VERSION}-1.src.rpm"
        test -s "$RUNNER_TEMP/release-assets/$legacy_srpm"
        (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$legacy_srpm.sha256")
        if [[ "$LEGACY_BRIDGE_ENABLED" == true ]]; then
          legacy_deb="bookshelfng_${VERSION}-1_amd64.deb"
          test -s "$RUNNER_TEMP/release-assets/$legacy_deb"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$legacy_deb.sha256")
          container_candidates="ChaptarrNG-${VERSION}-bookshelfng-container-platform-candidates.tar.gz"
          test -s "$RUNNER_TEMP/release-assets/$container_candidates"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$container_candidates.sha256")
          tar -tzf "$RUNNER_TEMP/release-assets/$container_candidates" >/dev/null
        fi
        mapfile -d '' release_files < <(find "$RUNNER_TEMP/release-assets" -mindepth 1 -maxdepth 1 -type f -print0)
        ((${#release_files[@]} > 0))
        gh release upload "$TAG" "${release_files[@]}" --clobber

    - name: Publish verified draft
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.release.outputs.tag }}
        RELEASE_BODY: ${{ needs.release.outputs.release_body }}
        RELEASE_TAG: ${{ needs.release.outputs.tag }}
        EXPECTED_RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RELEASE_TAG" != "$EXPECTED_RELEASE_TAG" ]]; then
          echo "Release publication does not match the validated release tag."
          exit 1
        fi
        notes="$RUNNER_TEMP/chaptarrng-release-notes.md"
        printf '%s\n' "$RELEASE_BODY" > "$notes"
        gh release edit "$TAG" \
          --notes-file "$notes" \
          --draft=false \
          --prerelease=false \
          --latest

  publish-packages:
    needs: [release, docker, publish-release]
    uses: ./.github/workflows/release-distribution.yml
    permissions:
      contents: read
      packages: write
    with:
      action: publish
      runner_pool: private
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      legacy_bridge_enabled: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
    secrets:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
      BOOKSHELFNG_COPR_WEBHOOK_URL: ${{ secrets.BOOKSHELFNG_COPR_WEBHOOK_URL }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  announce-discord:
    name: Announce release to Discord
    needs: [release, docker, publish-release]
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-announce-discord"]}}', github.run_id)) }}
    permissions:
      contents: read
    env:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      ANNOUNCEMENT_TITLE: ChaptarrNG ${{ needs.release.outputs.tag }} release notes
      ANNOUNCEMENT_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}
      ANNOUNCEMENT_BODY: ${{ needs.release.outputs.release_body }}
      ANNOUNCEMENT_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ANNOUNCEMENT_IMAGE_REF: ghcr.io/snapetech-org/chaptarrng:${{ needs.release.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Check Discord destination
      run: |
        if [[ -z "$DISCORD_RELEASE_WEBHOOK" ]]; then
          echo "::error::Add the DISCORD_RELEASE_WEBHOOK repository secret using the same webhook configured for SeerrNG."
          exit 1
        fi

    - name: Send Discord announcement
      run: node scripts/post-discord-announcement.mjs
