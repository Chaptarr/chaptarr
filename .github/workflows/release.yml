name: Release

# Manual only. Releases are cut from the maintained stable main branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
    - name: Require a releasable branch
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
          echo "Releases must run from main; selected ref is ${GITHUB_REF}."
          exit 1
        fi

  validate:
    needs: preflight
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Resolve head
      id: head
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Guard - versions in sync
      run: python3 build-tools/version_guard.py sync

    - name: Resolve tag
      id: tag
      shell: bash
      run: |
        set -euo pipefail
        VERSION="$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Guard - tag matches versions
      run: python3 build-tools/version_guard.py release-tag --tag "${{ steps.tag.outputs.tag }}"

    - name: Guard - curated fork release notes exist
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        NOTES="release-notes/${TAG}.md"
        if [[ ! -s "$NOTES" ]]; then
          echo "Missing curated release notes: $NOTES"
          echo "Add this file before running the release so inherited upstream history is not presented as fork changes."
          exit 1
        fi

    - name: Guard - selected branch has not advanced
      shell: bash
      run: |
        set -euo pipefail
        HEAD_SHA="$(git rev-parse HEAD)"
        REMOTE_HEAD_SHA="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"

        if [[ -z "$REMOTE_HEAD_SHA" ]]; then
          echo "Unable to resolve the current remote head for ${GITHUB_REF_NAME}."
          exit 1
        fi

        if [[ "$REMOTE_HEAD_SHA" != "$HEAD_SHA" ]]; then
          echo "${GITHUB_REF_NAME} advanced to ${REMOTE_HEAD_SHA} while this run tested ${HEAD_SHA}."
          echo "Run the release workflow again so the published image includes the current branch head."
          exit 1
        fi

    - name: Create tag if absent
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        TAG="${{ steps.tag.outputs.tag }}"
        HEAD_SHA="$(git rev-parse HEAD)"

        REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}' || true)"
        if [[ -z "$REMOTE_SHA" ]]; then
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}' || true)"
        fi

        if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$HEAD_SHA" ]]; then
          echo "Tag $TAG already exists at $REMOTE_SHA but HEAD is $HEAD_SHA. Bump the version first."
          exit 1
        fi

        if [[ -z "$REMOTE_SHA" ]]; then
          echo "Creating tag $TAG"
          git tag "$TAG"
          git push origin "$TAG"
        else
          echo "Tag $TAG already on this commit."
        fi

    - name: Create draft release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        TAG="${{ steps.tag.outputs.tag }}"
        NOTES="release-notes/${TAG}.md"

        if [[ ! -s "$NOTES" ]]; then
          echo "Missing curated release notes: $NOTES"
          echo "Add this file before running the release so inherited upstream history is not shown as fork changes."
          exit 1
        fi

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists; the post-image job will publish it after GHCR succeeds."
          exit 0
        fi

        # Native zips stay suppressed until they pass the viability gates. Docker is
        # the supported install.
        gh release create "$TAG" \
          --title "ChaptarrNG $TAG" \
          --notes-file "$NOTES" \
          --draft \
          --verify-tag

  # Images publish here and nowhere else, so merging PRs never ships an update.
  docker:
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      sha: ${{ needs.release.outputs.sha }}
      branch: ${{ github.ref_name }}

  yunohost-assets:
    needs: [release, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false

    - name: Build YunoHost bundles from the released GHCR image
      env:
        TAG: ${{ needs.release.outputs.tag }}
      run: ./build-tools/package-yunohost-release-assets.sh "$TAG"

    - name: Attach YunoHost bundles to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.release.outputs.tag }}
      run: gh release upload "$TAG" dist-yunohost/*.tar.gz --clobber

  publish-release:
    needs: [release, docker, yunohost-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false

    - name: Publish verified draft
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.release.outputs.tag }}
        BRANCH: ${{ github.ref_name }}
      shell: bash
      run: |
        set -euo pipefail
        NOTES="release-notes/${TAG}.md"
        if [[ "$BRANCH" != "main" ]]; then
          echo "Stable releases must be published from main."
          exit 1
        fi
        gh release edit "$TAG" --notes-file "$NOTES" --draft=false --prerelease=false --latest
