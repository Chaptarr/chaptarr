<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Chaptarr OAuth</title>
    <script><!--
    	(function() {
    	  try {
    	    var key = 'chaptarr.oauth.' + (window.name || 'default');
    	    window.localStorage.setItem(key, window.location.search || '');
    	  } catch (e) {
    	    // Ignore storage errors (e.g., disabled storage)
    	  }

    	  window.close();
    	})();
    --></script>
  </head>
  <body></body>
</html>
