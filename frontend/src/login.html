<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Chrome, Opera, and Firefox OS -->
    <meta name="theme-color" content="#3a3f51" />
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#3a3f51" />
    <!-- Android/Apple Phone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="description" content="Chaptarr" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/Content/Images/Icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/Content/Images/Icons/favicon.svg"
    />
    <link rel="manifest" href="/Content/Images/Icons/manifest.json" crossorigin="use-credentials" />
    <link
      rel="mask-icon"
      href="/Content/Images/Icons/safari-pinned-tab.svg"
      color="#7d1b1b"
    />
    <meta
      name="msapplication-config"
      content="/Content/Images/Icons/browserconfig.xml"
    />

    <!-- NOTE: The main UI uses a hashed stylesheet; the login page is intentionally self-styled to avoid hardcoding a build hash here. -->
    <link rel="stylesheet" type="text/css" href="/Content/Fonts/fonts.css" />

    <title>Login - Chaptarr</title>

    <style>
      :root {
        /* Light theme (matches app light theme + auto default) */
        --page-bg: #f5f7fa;
        --panel-header-bg: #ca302d;
        --panel-body-bg: #ffffff;
        --panel-border: rgba(0, 0, 0, 0.08);
        --panel-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);

        --text: #515253;
        --muted: #909293;

        --input-bg: #ffffff;
        --input-text: #333333;
        --input-border: #dde6e9;
        --input-border-focus: #66afe9;
        --input-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075);
        --input-shadow-focus: inset 0 1px 1px rgba(0, 0, 0, 0.075),
          0 0 8px rgba(102, 175, 233, 0.6);

        --primary-bg: #5d9cec;
        --primary-border: #5899eb;
        --primary-hover-bg: #4b91ea;
        --primary-hover-border: #3483e7;
        --primary-text: #ffffff;

        --secondary-bg: #ffffff;
        --secondary-border: #eaeaea;
        --secondary-hover-bg: #f5f5f5;
        --secondary-hover-border: #d6d6d6;
        --secondary-text: #515253;

        /* Plex brand-ish */
        --plex-bg: #e5a00d;
        --plex-border: #d69600;
        --plex-hover-bg: #d99000;
        --plex-hover-border: #c88600;
        --plex-text: #111111;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          /* Dark theme (matches app dark theme + auto default) */
          --page-bg: #202020;
          --panel-header-bg: #2a2a2a;
          --panel-body-bg: #2a2a2a;
          --panel-border: rgba(255, 255, 255, 0.10);
          --panel-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);

          --text: #cccccc;
          --muted: #909293;

          --input-bg: #333333;
          --input-text: #eeeeee;
          --input-border: #393f45;
          --input-border-focus: #66afe9;
          --input-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.2);
          --input-shadow-focus: inset 0 1px 1px rgba(0, 0, 0, 0.2),
            0 0 8px rgba(102, 175, 233, 0.6);

          --primary-bg: #0b8750;
          --primary-border: #1d563d;
          --primary-hover-bg: #097948;
          --primary-hover-border: #1d563d;
          --primary-text: #ffffff;

          --secondary-bg: #333333;
          --secondary-border: #393f45;
          --secondary-hover-bg: #444444;
          --secondary-hover-border: #5a6265;
          --secondary-text: #eeeeee;
        }
      }

      body {
        background-color: var(--page-bg);
        color: var(--text);
        font-family: "Roboto", "open sans", "Helvetica Neue", Helvetica, Arial,
          sans-serif;
      }

      .center {
        display: flex;
        justify-content: center;
      }

      .content {
        flex: 0 0 325px;
      }

      .logo {
        width: 64px;
        height: 64px;
      }

      .panel {
        margin-top: 50px;
        border-radius: 10px;
        box-shadow: var(--panel-shadow);
        border: 1px solid var(--panel-border);
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        justify-content: center;
        padding: 10px;
        background-color: var(--panel-header-bg);
      }

      .panel-body {
        padding: 20px;
        background-color: var(--panel-body-bg);
      }

      .sign-in {
        padding: 10px 0;
        text-align: center;
        letter-spacing: 0.06em;
        font-weight: 600;
      }

      .form-group {
        margin: 20px 0;
      }

      .form-input {
        box-sizing: border-box;
        padding: 6px 16px;
        width: 100%;
        height: 35px;
        border: 1px solid var(--input-border);
        border-radius: 4px;
        box-shadow: var(--input-shadow);
        background-color: var(--input-bg);
        color: var(--input-text);
      }

      .form-input:focus {
        outline: 0;
        border-color: var(--input-border-focus);
        box-shadow: var(--input-shadow-focus);
      }

      .button {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-top: 20px;
        padding: 10px 16px;
        width: 100%;
        min-height: 42px;
        border: 1px solid;
        border-color: var(--primary-border);
        border-radius: 4px;
        background-color: var(--primary-bg);
        color: var(--primary-text);
        vertical-align: middle;
        text-align: center;
        white-space: nowrap;
        line-height: normal;
        text-decoration: none;
        cursor: pointer;
        font-weight: 600;
      }

      .button:hover {
        border-color: var(--primary-hover-border);
        background-color: var(--primary-hover-bg);
        color: var(--primary-text);
        text-decoration: none;
      }

      .button-secondary {
        border-color: var(--secondary-border);
        background-color: var(--secondary-bg);
        color: var(--secondary-text);
      }

      .button-secondary:hover {
        border-color: var(--secondary-hover-border);
        background-color: var(--secondary-hover-bg);
        color: var(--secondary-text);
      }

      .button-plex {
        border-color: var(--plex-border);
        background-color: var(--plex-bg);
        color: var(--plex-text);
      }

      .button-plex:hover {
        border-color: var(--plex-hover-border);
        background-color: var(--plex-hover-bg);
        color: var(--plex-text);
      }

      .copy {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        color: var(--muted);
      }

      .remember-me-container {
        display: flex;
        justify-content: space-between;
        line-height: 25px;
      }

      .remember-me {
        font-size: 14px;
      }

      .forgot-password {
        margin-left: auto;
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
      }

      .forgot-password:focus,
      .forgot-password:hover {
        color: var(--text);
        text-decoration: underline;
      }

      .forgot-password:visited {
        color: var(--muted);
      }

      .login-failed {
        margin-top: 20px;
        color: #f05050;
        font-size: 14px;
      }

      .sso-container {
        margin-top: 20px;
      }

      .sso-note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .toggle-local {
        margin-top: 10px;
        text-align: center;
        font-size: 13px;
      }

      .toggle-local a {
        color: var(--muted);
        text-decoration: none;
      }

      .toggle-local a:hover {
        color: var(--text);
        text-decoration: underline;
      }

      .hidden {
        display: none;
      }

      @media only screen and (min-device-width: 375px) and (max-device-width: 812px) {
        .form-input {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="center">
      <div class="content">
        <div class="panel">
          <div class="panel-header">
            <img src="/Content/Images/chaptarr-logo.svg" alt="Chaptarr logo" class="logo" />
          </div>

          <div class="panel-body">
            <div id="sign-in-prompt" class="sign-in">
              SIGN IN TO CONTINUE
            </div>

            <form
              id="local-login-form"
              role="form"
              data-parsley-validate=""
              novalidate=""
              class="mb-lg"
              method="POST"
            >
              <div class="form-group">
                <input
                  type="email"
                  name="username"
                  class="form-input"
                  placeholder="Username"
                  autocomplete="off"
                  pattern=".{1,}"
                  required
                  title="Username is required"
                  autoFocus="true"
                  autoCapitalize="false"
                />
              </div>

              <div class="form-group">
                <input
                  type="password"
                  name="password"
                  class="form-input"
                  placeholder="Password"
                  required
                />
              </div>

              <div class="remember-me-container">
                <span class="remember-me">
                  <input
                    type="checkbox"
                    name="rememberMe"
                    id="rememberMe"
                    checked="checked"
                  />
                  <label id="remember-me-label" for="rememberMe">Remember me</label>
                </span>

              </div>
              <button id="login-button" type="submit" class="button">Login</button>

              <div id="login-failed" class="login-failed hidden" role="alert" aria-live="assertive">
                Incorrect username or password
              </div>
              <div id="sso-failed" class="login-failed hidden" role="alert" aria-live="assertive"></div>
            </form>

            <div id="sso-container" class="sso-container hidden">
              <a id="plex-login" class="button button-plex hidden" href="#">Continue with Plex</a>
              <a id="oidc-login" class="button hidden" href="#">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><use id="oidc-login-icon" href="#"></use></svg>
                <span id="oidc-login-label">Continue with SSO</span>
              </a>
              <a id="oidc-provider-help" class="hidden" href="#" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;margin-top:8px;font-size:12px;">Provider setup guide</a>
              <div id="sso-note" class="sso-note hidden">
                You will be redirected to your identity provider to sign in.
              </div>
            </div>

            <div id="local-login-toggle-container" class="toggle-local hidden">
              <a id="local-login-toggle" href="#">Use a local account instead</a>
            </div>
          </div>
        </div>

        <div id="copy" class="copy hidden">
          <span>&copy;</span>
          <span id="year"></span>
          <span>-</span>
          <span>Chaptarr</span>
        </div>
      </div>
    </div>
  </body>

  <script type="text/javascript">
    var yearSpan = document.getElementById("year");
    yearSpan.innerHTML = "2017-" + new Date().getFullYear();

    var copyDiv = document.getElementById("copy");
    copyDiv.classList.remove("hidden");

    var authMethod = "__AUTH_METHOD__";
    var urlBase = "__URL_BASE__";
    var oidcProviderId = "__OIDC_PROVIDER__";
    var oidcProviders = {
      generic: ["identity provider", "generic", "https://openid.net/developers/how-connect-works/"],
      google: ["Google", "google", "https://developers.google.com/identity/openid-connect/openid-connect"],
      "microsoft-entra": ["Microsoft Entra ID", "microsoft", "https://learn.microsoft.com/en-us/entra/identity-platform/v2-protocols-oidc"],
      okta: ["Okta", "okta", "https://developer.okta.com/docs/guides/implement-grant-type/authcodepkce/main/"],
      auth0: ["Auth0", "auth0", "https://auth0.com/docs/get-started/authentication-and-authorization-flow/authorization-code-flow"],
      keycloak: ["Keycloak", "keycloak", "https://www.keycloak.org/docs/latest/server_admin/"],
      authentik: ["authentik", "authentik", "https://docs.goauthentik.io/add-secure-apps/providers/oauth2/create-oauth2-provider/"],
      zitadel: ["ZITADEL", "zitadel", "https://zitadel.com/docs/guides/integrate/login/oidc/oauth-recommended-flows"],
      "amazon-cognito": ["Amazon Cognito", "amazon-cognito", "https://docs.aws.amazon.com/cognito/latest/developerguide/federation-endpoints.html"],
      "apple-sign-in": ["Apple", "apple", "https://developer.apple.com/documentation/signinwithapple/configuring-your-environment-for-sign-in-with-apple"],
      gitlab: ["GitLab", "gitlab", "https://docs.gitlab.com/integration/openid_connect_provider/"],
      "fusionauth": ["FusionAuth", "fusionauth", "https://fusionauth.io/docs/lifecycle/authenticate-users/oauth/"],
      "onelogin": ["OneLogin", "onelogin", "https://developers.onelogin.com/docs/openid-connect/connect-to-onelogin/"],
      "pingone": ["PingOne", "pingone", "https://docs.pingidentity.com/pingone/applications/p1_edit_application_oidc.html"],
      "jumpcloud": ["JumpCloud", "jumpcloud", "https://jumpcloud.com/support/sso-with-oidc"]
    };
    var oidcProvider = Object.prototype.hasOwnProperty.call(oidcProviders, oidcProviderId)
      ? oidcProviders[oidcProviderId]
      : oidcProviders.generic;

    var ssoContainer = document.getElementById("sso-container");
    var plexLoginLink = document.getElementById("plex-login");
    var oidcLoginLink = document.getElementById("oidc-login");
    var localLoginForm = document.getElementById("local-login-form");
    var ssoNote = document.getElementById("sso-note");
    var localLoginToggleContainer = document.getElementById("local-login-toggle-container");
    var localLoginToggle = document.getElementById("local-login-toggle");
    var translations = {};

    function translate(key, fallback) {
      return translations[key] || fallback;
    }

    function updateSsoFailureMessage() {
      var messages = {
        oidc_discovery_unreachable: ["AuthOidcDiscoveryUnreachable", "SSO sign-in failed. Chaptarr could not retrieve the OpenID Connect discovery document from your identity provider. Check DNS, proxy, and firewall access from the server or container. If required, configure the proxy to route all traffic."],
        oidc_backchannel_timeout: ["AuthOidcBackchannelTimeout", "SSO sign-in failed. Chaptarr timed out while contacting your identity provider. Check DNS, proxy, and firewall access from the server or container. If required, configure the proxy to route all traffic."],
        missing_callback_parameters: ["AuthMissingCallbackParameters", "SSO sign-in failed. The callback URL was reached without the expected parameters. Check your identity provider's authorization code flow and reverse proxy settings."],
        cookie_or_proxy_issue: ["AuthCookieOrProxyIssue", "SSO sign-in failed. This is often caused by blocked cookies or a reverse proxy misconfiguration."],
        oidc_email_missing: ["AuthOidcEmailMissing", "SSO sign-in failed. Your identity provider did not send an email claim, which Chaptarr needs to check its email allow-list. Make sure the email scope is granted."],
        oidc_email_not_verified: ["AuthOidcEmailNotVerified", "SSO sign-in failed. Your identity provider reported that this account's email is not verified. Chaptarr cannot match unverified email addresses against its allow-list; verify the address with your identity provider."],
        oidc_user_not_allowed: ["AuthOidcUserNotAllowed", "SSO sign-in failed. This account's email is not in Chaptarr's allowed email addresses or domains."]
      };
      var message = messages[ssoError];
      ssoFailedDiv.textContent = message ? translate(message[0], message[1]) : translate("AuthSsoSignInFailed", "SSO sign-in failed.");
    }

    function applyTranslations(localization) {
      translations = localization.Strings || {};
      if (localization.Locale) {
        var locale = localization.Locale.replace(/_/g, "-");
        var language = locale.toLowerCase().split("-", 1)[0];
        document.documentElement.lang = locale;
        document.documentElement.dir = ["dv", "fa", "he", "ku", "ps", "sd", "ug", "ur", "yi"].includes(language)
          ? "rtl"
          : "ltr";
      }

      document.title = translate("AuthLoginTitle", "Login - Chaptarr");
      document.querySelector(".logo").alt = translate("AuthLoginLogoAlt", "Chaptarr logo");
      document.getElementById("sign-in-prompt").textContent = translate("AuthSignInPrompt", "Sign in to continue");
      var usernameInput = document.querySelector("input[name='username']");
      usernameInput.placeholder = translate("Username", "Username");
      usernameInput.title = translate("UsernameRequired", "Username is required");
      document.querySelector("input[name='password']").placeholder = translate("Password", "Password");
      document.getElementById("remember-me-label").textContent = translate("RememberMe", "Remember me");
      document.getElementById("login-button").textContent = translate("Login", "Login");
      document.getElementById("login-failed").textContent = translate("AuthIncorrectCredentials", "Incorrect username or password");
      plexLoginLink.textContent = translate("AuthContinueWithPlex", "Continue with Plex");
      document.getElementById("oidc-login-label").textContent = "Continue with " + oidcProvider[0];
      localLoginToggle.textContent = translate("AuthUseLocalAccountInstead", "Use a local account instead");

      if (authMethod === "plex") {
        ssoNote.textContent = translate("AuthPlexSignInNote", "You will be redirected to Plex to sign in.");
      } else if (authMethod === "oidc") {
        ssoNote.textContent = translate("AuthIdentityProviderSignInNote", "You will be redirected to your identity provider to sign in.");
      }

      if (ssoFailed) {
        updateSsoFailureMessage();
      }
    }

    var urlParams = new URLSearchParams(window.location.search);
    var loginFailed = urlParams.get("loginFailed") === "true";
    var ssoFailed = urlParams.get("ssoFailed") === "true";
    var ssoError = urlParams.get("ssoError") || "";

    if (loginFailed) {
      var loginFailedDiv = document.getElementById("login-failed");
      loginFailedDiv.classList.remove("hidden");
    }

    if (ssoFailed) {
      var ssoFailedDiv = document.getElementById("sso-failed");
      ssoFailedDiv.classList.remove("hidden");
      updateSsoFailureMessage();
    }

    var returnUrl = urlParams.get("returnUrl") || "/";
    var showLocalLogin = loginFailed || ssoFailed;

    if (localLoginToggle) {
      localLoginToggle.addEventListener("click", function (e) {
        e.preventDefault();
        localLoginForm.classList.remove("hidden");
        localLoginToggleContainer.classList.add("hidden");
      });
    }

    if (authMethod === "plex") {
      ssoContainer.classList.remove("hidden");
      plexLoginLink.classList.remove("hidden");
      ssoNote.classList.remove("hidden");
      plexLoginLink.href = urlBase + "/auth/plex?returnUrl=" + encodeURIComponent(returnUrl);
      ssoNote.textContent = "You will be redirected to Plex to sign in.";

      if (!showLocalLogin) {
        localLoginForm.classList.add("hidden");
        localLoginToggleContainer.classList.remove("hidden");
      }
    } else if (authMethod === "oidc") {
      ssoContainer.classList.remove("hidden");
      oidcLoginLink.classList.remove("hidden");
      ssoNote.classList.remove("hidden");
      oidcLoginLink.href = urlBase + "/auth/oidc?returnUrl=" + encodeURIComponent(returnUrl);
      document.getElementById("oidc-login-icon").setAttribute("href", urlBase + "/Content/Images/oidc-provider-icons.svg#oidc-" + oidcProvider[1]);
      var oidcProviderHelp = document.getElementById("oidc-provider-help");
      oidcProviderHelp.href = oidcProvider[2];
      oidcProviderHelp.textContent = "Setup guide for " + oidcProvider[0] + " ↗";
      oidcProviderHelp.setAttribute("aria-label", oidcProvider[0] + " identity provider setup guide (opens in a new tab)");
      oidcProviderHelp.classList.remove("hidden");
      ssoNote.textContent = "You will be redirected to your identity provider to sign in.";

      if (!showLocalLogin) {
        localLoginForm.classList.add("hidden");
        localLoginToggleContainer.classList.remove("hidden");
      }
    }

    fetch(urlBase + "/api/v1/localization", { credentials: "same-origin", headers: { "X-ChaptarrNG-Client": "native" } })
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Localization request failed");
        }
        return response.json();
      })
      .then(applyTranslations)
      .catch(function () {
        // The English copy in the page remains available if localization cannot be loaded.
      });
  </script>
</html>
