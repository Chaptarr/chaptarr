services:
  bookshelfng:
    image: ${CHAPTARRNG_IMAGE:-ghcr.io/snapetech-org/chaptarrng:latest}
    container_name: bookshelfng
    restart: unless-stopped
    stop_grace_period: 8h30m
    environment:
      CHAPTARR_BOOKSHELF_COMPATIBILITY: "true"
      CHAPTARR_DEFAULT_PORT: ${BOOKSHELFNG_PORT:-8787}
      CHAPTARR_EXPECTED_PORT: ${BOOKSHELFNG_PORT:-8787}
      BOOKSHELFNG_MIGRATION_MODE: ${BOOKSHELFNG_MIGRATION_MODE:-automatic}
      # The previous catalog Compose candidate used the Hardcover image.
      # Set false only when migrating a prior softcover image.
      HARDCOVER: ${HARDCOVER:-true}
      HARDCOVER_NATIVE: ${HARDCOVER_NATIVE:-true}
      HARDCOVER_AUTH: ${HARDCOVER_AUTH:-}
      HARDCOVER_API_KEY: ${HARDCOVER_API_KEY:-}
      HARDCOVER_API_URL: ${HARDCOVER_API_URL:-}
      HARDCOVER_APIFY_TOKEN: ${HARDCOVER_APIFY_TOKEN:-}
      HARDCOVER_APIFY_GOODREADS_ACTOR: ${HARDCOVER_APIFY_GOODREADS_ACTOR:-}
      HARDCOVER_APIFY_GOODREADS_INPUT_TEMPLATE: ${HARDCOVER_APIFY_GOODREADS_INPUT_TEMPLATE:-}
      BOOKSHELF_ALLOW_API_KEY_QUERY: ${BOOKSHELF_ALLOW_API_KEY_QUERY:-}
      BOOKSHELF_DIAGNOSTICS_ENABLED: ${BOOKSHELF_DIAGNOSTICS_ENABLED:-}
      BOOKSHELF_DIAGNOSTICS_AUTH_TOKEN: ${BOOKSHELF_DIAGNOSTICS_AUTH_TOKEN:-}
      BOOKSHELF_DIAGNOSTICS_OTLP_ENDPOINT: ${BOOKSHELF_DIAGNOSTICS_OTLP_ENDPOINT:-}
      BOOKSHELF_METADATA_SOURCES: ${BOOKSHELF_METADATA_SOURCES:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      EUROPEANA_API_KEY: ${EUROPEANA_API_KEY:-}
      OPEN_LIBRARY_CONTACT_EMAIL: ${OPEN_LIBRARY_CONTACT_EMAIL:-}
      BOOKSHELF_OIDC_ISSUER_URL: ${BOOKSHELF_OIDC_ISSUER_URL:-}
      BOOKSHELF_OIDC_CLIENT_ID: ${BOOKSHELF_OIDC_CLIENT_ID:-}
      BOOKSHELF_OIDC_CLIENT_SECRET: ${BOOKSHELF_OIDC_CLIENT_SECRET:-}
      BOOKSHELF_OIDC_REDIRECT_URI: ${BOOKSHELF_OIDC_REDIRECT_URI:-}
      BOOKSHELF_OIDC_SCOPES: ${BOOKSHELF_OIDC_SCOPES:-}
      BOOKSHELF_OIDC_ALLOWED_EMAILS: ${BOOKSHELF_OIDC_ALLOWED_EMAILS:-}
      BOOKSHELF_OIDC_ALLOWED_EMAIL_DOMAINS: ${BOOKSHELF_OIDC_ALLOWED_EMAIL_DOMAINS:-}
      BOOKSHELF_OIDC_ALLOW_ANY_VERIFIED_USER: ${BOOKSHELF_OIDC_ALLOW_ANY_VERIFIED_USER:-}
      BOOKSHELF_OIDC_ALLOW_PRIVATE_ISSUER: ${BOOKSHELF_OIDC_ALLOW_PRIVATE_ISSUER:-}
      BOOKSHELF_OIDC_PROVIDER: ${BOOKSHELF_OIDC_PROVIDER:-}
      BOOKSHELF_SEERRNG_API_KEY: ${BOOKSHELF_SEERRNG_API_KEY:-}
      BOOKSHELF_M4B_MERGE: ${BOOKSHELF_M4B_MERGE:-false}
      BOOKSHELF_M4B_AAC_BITRATE_KBPS: ${BOOKSHELF_M4B_AAC_BITRATE_KBPS:-128}
      BOOKSHELF_FFMPEG_PATH: ${BOOKSHELF_FFMPEG_PATH:-}
      METADATA_URL: ${METADATA_URL:-}
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-}
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Etc/UTC}
      MAX_PATH: ${MAX_PATH:-}
      MAX_NAME: ${MAX_NAME:-}
      # Preserve the legacy Readarr-compatible option sections as well as
      # provider-specific variables. Blank aliases are ignored by ChaptarrNG.
      BOOKSHELF__APP__INSTANCENAME: ${BOOKSHELF__APP__INSTANCENAME:-}
      BOOKSHELF__APP__THEME: ${BOOKSHELF__APP__THEME:-}
      BOOKSHELF__APP__LAUNCHBROWSER: ${BOOKSHELF__APP__LAUNCHBROWSER:-}
      BOOKSHELF__AUTH__APIKEY: ${BOOKSHELF__AUTH__APIKEY:-}
      BOOKSHELF__AUTH__ENABLED: ${BOOKSHELF__AUTH__ENABLED:-}
      BOOKSHELF__AUTH__METHOD: ${BOOKSHELF__AUTH__METHOD:-}
      BOOKSHELF__AUTH__REQUIRED: ${BOOKSHELF__AUTH__REQUIRED:-}
      BOOKSHELF__AUTH__TRUSTCGNATIPADDRESSES: ${BOOKSHELF__AUTH__TRUSTCGNATIPADDRESSES:-}
      BOOKSHELF__SERVER__REQUESTSPERMINUTE: ${BOOKSHELF__SERVER__REQUESTSPERMINUTE:-}
      BOOKSHELF__SERVER__TRUSTEDPROXIES: ${BOOKSHELF__SERVER__TRUSTEDPROXIES:-}
      BOOKSHELF__SERVER__ALLOWEDORIGINS: ${BOOKSHELF__SERVER__ALLOWEDORIGINS:-}
      BOOKSHELF__SERVER__MAXREQUESTBODYSIZE: ${BOOKSHELF__SERVER__MAXREQUESTBODYSIZE:-}
      BOOKSHELF__LOG__LEVEL: ${BOOKSHELF__LOG__LEVEL:-}
      BOOKSHELF__LOG__ROTATE: ${BOOKSHELF__LOG__ROTATE:-}
      BOOKSHELF__LOG__SQL: ${BOOKSHELF__LOG__SQL:-}
      BOOKSHELF__LOG__CONSOLELEVEL: ${BOOKSHELF__LOG__CONSOLELEVEL:-}
      BOOKSHELF__LOG__SYSLOGSERVER: ${BOOKSHELF__LOG__SYSLOGSERVER:-}
      BOOKSHELF__LOG__SYSLOGPORT: ${BOOKSHELF__LOG__SYSLOGPORT:-}
      BOOKSHELF__LOG__SYSLOGLEVEL: ${BOOKSHELF__LOG__SYSLOGLEVEL:-}
      BOOKSHELF__UPDATE__MECHANISM: ${BOOKSHELF__UPDATE__MECHANISM:-}
      BOOKSHELF__UPDATE__AUTOMATICALLY: ${BOOKSHELF__UPDATE__AUTOMATICALLY:-}
      BOOKSHELF__UPDATE__SCRIPTPATH: ${BOOKSHELF__UPDATE__SCRIPTPATH:-}
      BOOKSHELF__UPDATE__BRANCH: ${BOOKSHELF__UPDATE__BRANCH:-}
      AUDIOARR__APP__INSTANCENAME: ${AUDIOARR__APP__INSTANCENAME:-}
      AUDIOARR__APP__THEME: ${AUDIOARR__APP__THEME:-}
      AUDIOARR__APP__LAUNCHBROWSER: ${AUDIOARR__APP__LAUNCHBROWSER:-}
      AUDIOARR__AUTH__APIKEY: ${AUDIOARR__AUTH__APIKEY:-}
      AUDIOARR__AUTH__ENABLED: ${AUDIOARR__AUTH__ENABLED:-}
      AUDIOARR__AUTH__METHOD: ${AUDIOARR__AUTH__METHOD:-}
      AUDIOARR__AUTH__REQUIRED: ${AUDIOARR__AUTH__REQUIRED:-}
      AUDIOARR__AUTH__TRUSTCGNATIPADDRESSES: ${AUDIOARR__AUTH__TRUSTCGNATIPADDRESSES:-}
      AUDIOARR__SERVER__REQUESTSPERMINUTE: ${AUDIOARR__SERVER__REQUESTSPERMINUTE:-}
      AUDIOARR__SERVER__TRUSTEDPROXIES: ${AUDIOARR__SERVER__TRUSTEDPROXIES:-}
      AUDIOARR__SERVER__ALLOWEDORIGINS: ${AUDIOARR__SERVER__ALLOWEDORIGINS:-}
      AUDIOARR__SERVER__MAXREQUESTBODYSIZE: ${AUDIOARR__SERVER__MAXREQUESTBODYSIZE:-}
      AUDIOARR__LOG__LEVEL: ${AUDIOARR__LOG__LEVEL:-}
      AUDIOARR__LOG__ROTATE: ${AUDIOARR__LOG__ROTATE:-}
      AUDIOARR__LOG__SQL: ${AUDIOARR__LOG__SQL:-}
      AUDIOARR__LOG__CONSOLELEVEL: ${AUDIOARR__LOG__CONSOLELEVEL:-}
      AUDIOARR__LOG__SYSLOGSERVER: ${AUDIOARR__LOG__SYSLOGSERVER:-}
      AUDIOARR__LOG__SYSLOGPORT: ${AUDIOARR__LOG__SYSLOGPORT:-}
      AUDIOARR__LOG__SYSLOGLEVEL: ${AUDIOARR__LOG__SYSLOGLEVEL:-}
      AUDIOARR__UPDATE__MECHANISM: ${AUDIOARR__UPDATE__MECHANISM:-}
      AUDIOARR__UPDATE__AUTOMATICALLY: ${AUDIOARR__UPDATE__AUTOMATICALLY:-}
      AUDIOARR__UPDATE__SCRIPTPATH: ${AUDIOARR__UPDATE__SCRIPTPATH:-}
      AUDIOARR__UPDATE__BRANCH: ${AUDIOARR__UPDATE__BRANCH:-}
      READARR__APP__INSTANCENAME: ${READARR__APP__INSTANCENAME:-}
      READARR__APP__THEME: ${READARR__APP__THEME:-}
      READARR__APP__LAUNCHBROWSER: ${READARR__APP__LAUNCHBROWSER:-}
      READARR__AUTH__APIKEY: ${READARR__AUTH__APIKEY:-}
      READARR__AUTH__ENABLED: ${READARR__AUTH__ENABLED:-}
      READARR__AUTH__METHOD: ${READARR__AUTH__METHOD:-}
      READARR__AUTH__REQUIRED: ${READARR__AUTH__REQUIRED:-}
      READARR__AUTH__TRUSTCGNATIPADDRESSES: ${READARR__AUTH__TRUSTCGNATIPADDRESSES:-}
      READARR__SERVER__REQUESTSPERMINUTE: ${READARR__SERVER__REQUESTSPERMINUTE:-}
      READARR__SERVER__TRUSTEDPROXIES: ${READARR__SERVER__TRUSTEDPROXIES:-}
      READARR__SERVER__ALLOWEDORIGINS: ${READARR__SERVER__ALLOWEDORIGINS:-}
      READARR__SERVER__MAXREQUESTBODYSIZE: ${READARR__SERVER__MAXREQUESTBODYSIZE:-}
      READARR__LOG__LEVEL: ${READARR__LOG__LEVEL:-}
      READARR__LOG__ROTATE: ${READARR__LOG__ROTATE:-}
      READARR__LOG__SQL: ${READARR__LOG__SQL:-}
      READARR__LOG__CONSOLELEVEL: ${READARR__LOG__CONSOLELEVEL:-}
      READARR__LOG__SYSLOGSERVER: ${READARR__LOG__SYSLOGSERVER:-}
      READARR__LOG__SYSLOGPORT: ${READARR__LOG__SYSLOGPORT:-}
      READARR__LOG__SYSLOGLEVEL: ${READARR__LOG__SYSLOGLEVEL:-}
      READARR__UPDATE__MECHANISM: ${READARR__UPDATE__MECHANISM:-}
      READARR__UPDATE__AUTOMATICALLY: ${READARR__UPDATE__AUTOMATICALLY:-}
      READARR__UPDATE__SCRIPTPATH: ${READARR__UPDATE__SCRIPTPATH:-}
      READARR__UPDATE__BRANCH: ${READARR__UPDATE__BRANCH:-}
      # Preserve old app-prefixed server settings when they were configured
      # outside config.xml. Blank aliases are ignored by ChaptarrNG.
      BOOKSHELF_PORT: ${BOOKSHELF_PORT:-}
      BOOKSHELF_URLBASE: ${BOOKSHELF_URLBASE:-}
      BOOKSHELF__SERVER__PORT: ${BOOKSHELF__SERVER__PORT:-}
      BOOKSHELF__SERVER__URLBASE: ${BOOKSHELF__SERVER__URLBASE:-}
      BOOKSHELF__SERVER__BINDADDRESS: ${BOOKSHELF__SERVER__BINDADDRESS:-}
      BOOKSHELF__SERVER__ENABLESSL: ${BOOKSHELF__SERVER__ENABLESSL:-}
      BOOKSHELF__SERVER__SSLPORT: ${BOOKSHELF__SERVER__SSLPORT:-}
      BOOKSHELF__SERVER__SSLCERTPATH: ${BOOKSHELF__SERVER__SSLCERTPATH:-}
      BOOKSHELF__SERVER__SSLCERTPASSWORD: ${BOOKSHELF__SERVER__SSLCERTPASSWORD:-}
      AUDIOARR__SERVER__PORT: ${AUDIOARR__SERVER__PORT:-}
      AUDIOARR__SERVER__URLBASE: ${AUDIOARR__SERVER__URLBASE:-}
      AUDIOARR__SERVER__BINDADDRESS: ${AUDIOARR__SERVER__BINDADDRESS:-}
      AUDIOARR__SERVER__ENABLESSL: ${AUDIOARR__SERVER__ENABLESSL:-}
      AUDIOARR__SERVER__SSLPORT: ${AUDIOARR__SERVER__SSLPORT:-}
      AUDIOARR__SERVER__SSLCERTPATH: ${AUDIOARR__SERVER__SSLCERTPATH:-}
      AUDIOARR__SERVER__SSLCERTPASSWORD: ${AUDIOARR__SERVER__SSLCERTPASSWORD:-}
      READARR__SERVER__PORT: ${READARR__SERVER__PORT:-}
      READARR__SERVER__URLBASE: ${READARR__SERVER__URLBASE:-}
      READARR__SERVER__BINDADDRESS: ${READARR__SERVER__BINDADDRESS:-}
      READARR__SERVER__ENABLESSL: ${READARR__SERVER__ENABLESSL:-}
      READARR__SERVER__SSLPORT: ${READARR__SERVER__SSLPORT:-}
      READARR__SERVER__SSLCERTPATH: ${READARR__SERVER__SSLCERTPATH:-}
      READARR__SERVER__SSLCERTPASSWORD: ${READARR__SERVER__SSLCERTPASSWORD:-}
      # PostgreSQL aliases are passed as a complete group so a custom source
      # server and database identity survive the image replacement.
      BOOKSHELF__POSTGRES__HOST: ${BOOKSHELF__POSTGRES__HOST:-}
      BOOKSHELF__POSTGRES__PORT: ${BOOKSHELF__POSTGRES__PORT:-}
      BOOKSHELF__POSTGRES__USER: ${BOOKSHELF__POSTGRES__USER:-}
      BOOKSHELF__POSTGRES__PASSWORD: ${BOOKSHELF__POSTGRES__PASSWORD:-}
      BOOKSHELF__POSTGRES__MAINDB: ${BOOKSHELF__POSTGRES__MAINDB:-}
      BOOKSHELF__POSTGRES__LOGDB: ${BOOKSHELF__POSTGRES__LOGDB:-}
      BOOKSHELF__POSTGRES__CACHEDB: ${BOOKSHELF__POSTGRES__CACHEDB:-}
      BOOKSHELF__POSTGRES__SSLMODE: ${BOOKSHELF__POSTGRES__SSLMODE:-}
      BOOKSHELF__POSTGRES__ROOTCERT: ${BOOKSHELF__POSTGRES__ROOTCERT:-}
      BOOKSHELF__POSTGRES__NORESETONCLOSE: ${BOOKSHELF__POSTGRES__NORESETONCLOSE:-}
      AUDIOARR__POSTGRES__HOST: ${AUDIOARR__POSTGRES__HOST:-}
      AUDIOARR__POSTGRES__PORT: ${AUDIOARR__POSTGRES__PORT:-}
      AUDIOARR__POSTGRES__USER: ${AUDIOARR__POSTGRES__USER:-}
      AUDIOARR__POSTGRES__PASSWORD: ${AUDIOARR__POSTGRES__PASSWORD:-}
      AUDIOARR__POSTGRES__MAINDB: ${AUDIOARR__POSTGRES__MAINDB:-}
      AUDIOARR__POSTGRES__LOGDB: ${AUDIOARR__POSTGRES__LOGDB:-}
      AUDIOARR__POSTGRES__CACHEDB: ${AUDIOARR__POSTGRES__CACHEDB:-}
      AUDIOARR__POSTGRES__SSLMODE: ${AUDIOARR__POSTGRES__SSLMODE:-}
      AUDIOARR__POSTGRES__ROOTCERT: ${AUDIOARR__POSTGRES__ROOTCERT:-}
      AUDIOARR__POSTGRES__NORESETONCLOSE: ${AUDIOARR__POSTGRES__NORESETONCLOSE:-}
      READARR__POSTGRES__HOST: ${READARR__POSTGRES__HOST:-}
      READARR__POSTGRES__PORT: ${READARR__POSTGRES__PORT:-}
      READARR__POSTGRES__USER: ${READARR__POSTGRES__USER:-}
      READARR__POSTGRES__PASSWORD: ${READARR__POSTGRES__PASSWORD:-}
      READARR__POSTGRES__MAINDB: ${READARR__POSTGRES__MAINDB:-}
      READARR__POSTGRES__LOGDB: ${READARR__POSTGRES__LOGDB:-}
      READARR__POSTGRES__CACHEDB: ${READARR__POSTGRES__CACHEDB:-}
      READARR__POSTGRES__SSLMODE: ${READARR__POSTGRES__SSLMODE:-}
      READARR__POSTGRES__ROOTCERT: ${READARR__POSTGRES__ROOTCERT:-}
      READARR__POSTGRES__NORESETONCLOSE: ${READARR__POSTGRES__NORESETONCLOSE:-}
    ports:
      - "127.0.0.1:${BOOKSHELFNG_HOST_PORT:-8787}:${BOOKSHELFNG_PORT:-8787}/tcp"
    volumes:
      - bookshelfng-config:/config
      - bookshelfng-books:/books
      - bookshelfng-downloads:/downloads

volumes:
  bookshelfng-config:
  bookshelfng-books:
  bookshelfng-downloads:
