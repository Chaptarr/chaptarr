worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /run/chaptarr-nginx/client_body;
    proxy_temp_path /run/chaptarr-nginx/proxy_temp;
    fastcgi_temp_path /run/chaptarr-nginx/fastcgi_temp;
    uwsgi_temp_path /run/chaptarr-nginx/uwsgi_temp;
    scgi_temp_path /run/chaptarr-nginx/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $chaptarr_forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    server {
        listen 8787;
        server_name _;
        client_max_body_size 0;

        # Cloudron requires a 2xx health response. Keep it available while the
        # supervisor migrates or recovers; the package entrypoint exits if a
        # child dies.
        location = /ping {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        error_page 502 503 504 =503 /bookshelfng-unavailable.html;

        location = /bookshelfng-unavailable.html {
            internal;
            root /usr/share/nginx/html;
        }

        location / {
            proxy_pass http://127.0.0.1:8788;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $chaptarr_forwarded_proto;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 8h30m;
            proxy_send_timeout 8h30m;
        }
    }
}
